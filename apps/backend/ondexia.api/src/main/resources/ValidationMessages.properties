# Mensajes por defecto de las anotaciones de validacion.
#
# Existe porque el frontend ya lleva cada mensaje de validacion junto a su
# campo, y ahi se leia lo que traia Hibernate Validator de fabrica: «el tamaño
# debe estar entre 0 y 200». Eso no lo escribio nadie para que un usuario lo
# leyera — habla de tamanos y de rangos, empieza en minuscula y no dice que
# hacer.
#
# Se hace aqui y no anotacion por anotacion a proposito. Poner `message = ...`
# en cada @Size son veinticinco sitios que hay que acordarse de rellenar, y el
# que se olvide vuelve a mostrar el texto de fabrica sin que nadie lo note. Con
# este fichero, lo que no se personaliza sale igualmente en nuestro idioma y
# nuestro tono, y una anotacion nueva ya nace cubierta.
#
# El texto concreto de un campo concreto SI va en su anotacion: «El nombre es
# obligatorio.» dice mas que «Este dato es obligatorio.». Esto es la red de
# seguridad, no el sustituto.
#
# Nota sobre Size: el texto asume `min = 0`, que es el caso de todos los usos
# actuales. Una restriccion que fije un minimo debe llevar su propio `message`.

jakarta.validation.constraints.NotNull.message = Este dato es obligatorio.
jakarta.validation.constraints.NotEmpty.message = Este dato es obligatorio.
jakarta.validation.constraints.NotBlank.message = Este dato es obligatorio.
jakarta.validation.constraints.Size.message = No puede pasar de {max} caracteres.
jakarta.validation.constraints.Pattern.message = El formato no es válido.
jakarta.validation.constraints.Email.message = El correo no tiene un formato válido.
jakarta.validation.constraints.Min.message = El valor mínimo es {value}.
jakarta.validation.constraints.Max.message = El valor máximo es {value}.
jakarta.validation.constraints.Positive.message = Tiene que ser mayor que cero.
jakarta.validation.constraints.PositiveOrZero.message = No puede ser negativo.
jakarta.validation.constraints.Digits.message = Admite {integer} dígitos y {fraction} decimales.
jakarta.validation.constraints.Past.message = La fecha tiene que ser anterior a hoy.
jakarta.validation.constraints.PastOrPresent.message = La fecha no puede ser futura.
jakarta.validation.constraints.Future.message = La fecha tiene que ser posterior a hoy.
jakarta.validation.constraints.FutureOrPresent.message = La fecha no puede ser pasada.
