# El wrapper fija la version de Maven en el repositorio. Sin el, el build
# depende de lo que cada maquina tenga instalado — y en esta ni siquiera hay
# Maven en el PATH. `./mvnw` lo descarga la primera vez y lo cachea.
#
# Maven 3.10.0 se adopta con el reactor y sus pruebas comprobados. El salto
# a Maven 4 requiere una evaluación independiente de compatibilidad.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
