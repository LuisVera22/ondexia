spring:
  application:
    name: ondexia-admin

  security:
    oauth2:
      resourceserver:
        jwt:
          # Marcador de posicion. El perfil `aws` lo sustituye por el emisor real
          # del grupo de PERSONAL de Cognito.
          #
          # Se declara un jwk-set-uri y no un issuer-uri porque el primero NO se
          # consulta al arrancar: el decodificador se construye perezoso. Con
          # issuer-uri, Spring descarga la configuracion OIDC durante el arranque
          # y la aplicacion no levanta sin red — algo que rompe las pruebas y el
          # arranque en local sin aportar nada.
          jwk-set-uri: http://localhost:1/sin-emisor-configurado

server:
  port: 8081

# Solo salud. Un actuator abierto en una consola que ve todas las cuentas seria
# regalar el mapa.
management:
  endpoints:
    web:
      exposure:
        include: health
