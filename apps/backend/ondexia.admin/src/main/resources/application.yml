spring:
  application:
    name: ondexia-admin

  # Sin fuente de datos todavia. El modulo arranca y responde /salud; las
  # consultas llegan en la entrega 4, con el rol ondexia_panel y autenticacion
  # IAM, igual que hace la API de clientes.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  port: 8081

# Nada de actuator abierto. Solo salud, que ademas tiene su propio controlador.
management:
  endpoints:
    web:
      exposure:
        include: health
