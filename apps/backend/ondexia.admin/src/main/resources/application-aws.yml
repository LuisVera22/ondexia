# Lo que depende de la plataforma. Vale igual en dev que en prod: lo que cambia
# entre entornos son los valores, y esos llegan como variables de entorno que
# pone Terraform.

spring:
  datasource:
    # Sin contrasena. La credencial es un token de IAM que se firma en cada
    # conexion — ver FuenteDeDatosIam.
    url: jdbc:postgresql://${BD_HOST}:${BD_PUERTO}/${BD_NOMBRE}
    username: ${BD_USUARIO}
    hikari:
      # Dos por contenedor, como la API. La consola la usan dos o tres personas;
      # abrir mas conexiones solo consumiria el cupo de una db.t4g.micro.
      maximum-pool-size: 2
      minimum-idle: 0

# Sin `spring.security.oauth2.resourceserver`, y es deliberado.
#
# Esa configuracion construye un decodificador que descarga el JWKS del emisor, y
# esta funcion vive en una subred privada sin NAT: la descarga se agota, el
# contexto no levanta y la pasarela devuelve 502. El decodificador lo pone
# SeguridadAdmin a mano; el porque completo esta en TokenDeLaPasarela.
ondexia:
  panel:
    # El grupo de PERSONAL, no el de inquilinos.
    emisor: ${COGNITO_EMISOR_PERSONAL}
    # El cliente de Cognito del panel: que el token sea para esta consola y no
    # para otra aplicacion del mismo grupo.
    cliente: ${COGNITO_CLIENTE_PANEL}
