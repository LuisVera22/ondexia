spring:
  flyway:
    # El esquema real, tomado de ondexia.api que es su dueno. Sin los datos de
    # ejemplo de db/local: cada prueba siembra lo suyo y asi se ve en la prueba
    # que se esta contando.
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Un emisor de mentira, y SOLO en pruebas.
          #
          # Estuvo en application.yml como marcador de posicion y fue un error
          # caro: cuando estan los dos, Spring da prioridad a jwk-set-uri sobre
          # issuer-uri, asi que en la nube el panel intentaba validar los tokens
          # contra localhost y respondia 502.
          #
          #   AuthenticationServiceException: An error occurred while attempting
          #   to decode the Jwt: I/O error on GET request for
          #   "http://localhost:1/sin-emisor-configurado": Connection refused
          #
          # Aqui no se llama nunca: las pruebas ponen la autenticacion con el
          # postprocesador jwt(), que no pasa por el decodificador. Se declara
          # solo para que el contexto arranque, y se usa jwk-set-uri en vez de
          # issuer-uri porque el primero NO consulta nada al arrancar.
          jwk-set-uri: http://localhost:1/solo-para-pruebas
