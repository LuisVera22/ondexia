<div>
  <app-page-breadcrumb [pageTitle]="titulo" />

  <div
    class="rounded-2xl border border-gray-200 bg-white px-5 py-16 dark:border-gray-800 dark:bg-white/[0.03] xl:px-10"
  >
    <div class="mx-auto w-full max-w-[520px] text-center">
      <span
        class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 text-brand-500 dark:bg-brand-500/10"
      >
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 7.5 12 3l8 4.5M4 7.5v9L12 21m-8-13.5L12 12m8-4.5v9L12 21m8-13.5L12 12m0 9v-9"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <h3 class="mb-3 font-semibold text-gray-800 text-theme-xl dark:text-white/90 sm:text-2xl">
        {{ titulo }}
      </h3>

      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 sm:text-base">
        Esta vista todavía no se construye. La navegación ya está habilitada para
        poder recorrer la estructura completa del sistema.
      </p>

      @if (etapa) {
      <div
        class="inline-flex items-center gap-2 rounded-full border border-gray-200 px-4 py-2 text-sm text-gray-600 dark:border-gray-700 dark:text-gray-300"
      >
        <span class="h-2 w-2 rounded-full bg-warning-500"></span>
        Programada para la {{ etapa }}
      </div>
      }
    </div>
  </div>
</div>
