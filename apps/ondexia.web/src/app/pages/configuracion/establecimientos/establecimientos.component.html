<div>
  <app-page-breadcrumb pageTitle="Establecimientos" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Locales registrados ante SUNAT bajo el mismo RUC. El código de
      establecimiento determina la serie de los comprobantes y el punto de
      partida de las guías de remisión.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar establecimiento
    </button>
  </div>

  <app-tabla-datos
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay establecimientos"
    vacioDescripcion="Registre al menos el establecimiento principal para poder emitir comprobantes."
    vacioAccion="Agregar establecimiento"
  >
    <ng-template #acciones let-registro>
      <div class="flex items-center justify-end gap-1">
        <button
          type="button"
          [attr.aria-label]="'Editar ' + registro.nombre"
          class="rounded-lg p-2 text-gray-400 transition hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-white/[0.05]"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4Z" />
          </svg>
        </button>

        @if (registro.tipo !== 'Principal') {
        <button
          type="button"
          (click)="pedirEliminacion(registro)"
          [attr.aria-label]="'Eliminar ' + registro.nombre"
          class="rounded-lg p-2 text-gray-400 transition hover:bg-error-50 hover:text-error-500 dark:hover:bg-error-500/10"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 7h14M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4.5h6V7" />
          </svg>
        </button>
        }
      </div>
    </ng-template>
  </app-tabla-datos>

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar el establecimiento?"
    mensaje="Las series asociadas dejarán de estar disponibles para emitir. Los comprobantes ya emitidos se conservan."
    textoConfirmar="Eliminar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
