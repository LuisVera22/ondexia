<div>
  <app-page-breadcrumb pageTitle="Configuración de comprobantes" />

  @if (guardado) {
  <div class="mb-5 rounded-xl border border-success-200 bg-success-50 p-4 dark:border-success-500/30 dark:bg-success-500/10">
    <p class="text-sm text-success-700 dark:text-success-400">
      Las preferencias se guardaron y se aplicarán a los comprobantes que se emitan desde ahora.
    </p>
  </div>
  }

  <form [formGroup]="formulario" (ngSubmit)="guardar()" class="space-y-5">
    <!-- Emisión -->
    <section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] xl:p-6">
      <h3 class="mb-5 font-medium text-gray-800 dark:text-white/90">Emisión</h3>

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label for="moneda" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Moneda predeterminada
          </label>
          <select id="moneda" formControlName="monedaPredeterminada"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90">
            <option value="PEN">Soles (PEN)</option>
            <option value="USD">Dólares (USD)</option>
          </select>
        </div>

        <div>
          <label for="tasaIgv" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Tasa de IGV vigente (%)
          </label>
          <input id="tasaIgv" type="number" min="0" max="100" step="0.01" formControlName="tasaIgv"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm tabular-nums text-gray-800 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:text-white/90" />
          <p class="mt-1.5 text-xs text-gray-500 dark:text-gray-400">
            Se aplica a las operaciones gravadas. Modificarla no altera los comprobantes ya emitidos.
          </p>
        </div>
      </div>
    </section>

    <!-- Impresión -->
    <section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] xl:p-6">
      <h3 class="mb-5 font-medium text-gray-800 dark:text-white/90">Impresión</h3>

      <div class="space-y-5">
        <div>
          <span class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Formato predeterminado</span>
          <div class="flex flex-wrap gap-3">
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-700 dark:border-gray-700 dark:text-gray-300">
              <input type="radio" formControlName="formatoImpresion" value="a4" class="text-brand-500 focus:ring-brand-500" />
              A4
            </label>
            <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-700 dark:border-gray-700 dark:text-gray-300">
              <input type="radio" formControlName="formatoImpresion" value="ticket" class="text-brand-500 focus:ring-brand-500" />
              Ticket 80 mm
            </label>
          </div>
        </div>

        <div>
          <label for="leyenda" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
            Leyenda al pie del comprobante
          </label>
          <textarea id="leyenda" formControlName="leyendaPie" rows="2"
            class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:text-white/90"></textarea>
        </div>
      </div>
    </section>

    <!-- Envío al cliente -->
    <section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] xl:p-6">
      <h3 class="mb-5 font-medium text-gray-800 dark:text-white/90">Envío al cliente</h3>

      <div class="space-y-4">
        <label class="flex cursor-pointer items-start gap-3">
          <input type="checkbox" formControlName="envioAutomatico"
            class="mt-0.5 h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500 dark:border-gray-600 dark:bg-gray-800" />
          <span>
            <span class="block text-sm text-gray-800 dark:text-white/90">Enviar el comprobante por correo automáticamente</span>
            <span class="block text-xs text-gray-500 dark:text-gray-400">
              Se envía al aceptarse en SUNAT, no al registrarse la venta.
            </span>
          </span>
        </label>

        <label class="flex cursor-pointer items-start gap-3">
          <input type="checkbox" formControlName="incluirXml"
            class="mt-0.5 h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500 dark:border-gray-600 dark:bg-gray-800" />
          <span>
            <span class="block text-sm text-gray-800 dark:text-white/90">Adjuntar el XML firmado además del PDF</span>
            <span class="block text-xs text-gray-500 dark:text-gray-400">
              Los clientes con contabilidad propia suelen necesitarlo.
            </span>
          </span>
        </label>
      </div>
    </section>

    <div class="flex justify-end">
      <button type="submit"
        class="rounded-lg bg-brand-500 px-5 py-3 text-sm font-medium text-white transition hover:bg-brand-600">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
