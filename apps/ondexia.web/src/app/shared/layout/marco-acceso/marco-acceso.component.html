<div class="relative flex min-h-screen flex-col bg-white dark:bg-gray-900 lg:flex-row">
  <!-- Columna del formulario -->
  <div class="flex w-full flex-1 items-center justify-center p-6 sm:p-10">
    <ng-content />
  </div>

  <!-- Columna de marca: decorativa, se retira en pantallas pequeñas -->
  <div class="relative hidden w-full items-center justify-center bg-brand-950 lg:flex lg:w-1/2 dark:bg-white/5">
    <!--
      Rejilla de puntos en lugar de una fotografía: pesa unos bytes en vez de
      cientos de kilobytes, se ve nítida en cualquier densidad de pantalla y no
      compite con el formulario por la atención.
    -->
    <div
      class="absolute inset-0 opacity-[0.15]"
      aria-hidden="true"
      style="
        background-image: radial-gradient(circle, #ffffff 1px, transparent 1px);
        background-size: 32px 32px;
      "
    ></div>

    <div class="relative flex max-w-xs flex-col items-center px-6 text-center">
      <a routerLink="/" class="mb-5 block" aria-label="Ondexia">
        <img src="/images/logo/auth-logo.svg" alt="Ondexia" width="231" height="48" />
      </a>
      <p class="text-dato text-gray-400">
        Gestión comercial y facturación electrónica para empresas peruanas
      </p>
    </div>
  </div>

  <!-- El tema también se alterna aquí: quien entra de noche no debería tragarse
       una pantalla blanca para luego cambiarlo dentro. -->
  <button
    type="button"
    (click)="tema.alternar()"
    [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    class="fixed bottom-6 right-6 z-50 flex size-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-elevado transition hover:text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
  >
    @if (tema.tema() === 'oscuro') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
    </svg>
    } @else {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
    </svg>
    }
  </button>
</div>
