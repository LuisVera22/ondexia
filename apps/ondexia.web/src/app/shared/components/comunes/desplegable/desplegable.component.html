<div class="relative">
  <button #disparador type="button" [id]="idCampo || null" [disabled]="deshabilitado"
    (click)="alternar()" (keydown)="alTeclear($event)"
    role="combobox" aria-haspopup="listbox"
    [attr.aria-expanded]="abierto()"
    [attr.aria-controls]="idBase + '-panel'"
    [attr.aria-activedescendant]="abierto() ? idOpcionResaltada : null"
    [attr.aria-label]="etiquetaAccesible || null"
    class="flex w-full items-center justify-between gap-2 rounded-lg border bg-transparent text-left text-sm transition focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 disabled:cursor-not-allowed disabled:opacity-50"
    [class]="alturas[alto] + ' ' + (abierto()
      ? 'border-brand-300 ring-3 ring-brand-500/20 dark:border-brand-500'
      : 'border-gray-300 hover:border-gray-400 dark:border-gray-700 dark:hover:border-gray-600')">
    <span class="truncate"
      [class]="haySeleccion ? 'text-gray-800 dark:text-white/90' : 'text-gray-400 dark:text-gray-500'">
      {{ textoVisible }}
    </span>

    <svg class="shrink-0 text-gray-400 transition-transform duration-200"
      [class.rotate-180]="abierto()"
      width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (abierto()) {
  <div [id]="idBase + '-panel'" role="listbox" [style]="posicion()"
    [attr.aria-label]="etiquetaAccesible || null"
    class="z-9999 overflow-y-auto rounded-lg border border-gray-200 bg-white py-1 shadow-theme-lg dark:border-gray-700 dark:bg-gray-900">
    @for (opcion of opciones; track opcion.valor; let i = $index) {
    <div [id]="idOpcion(i)" role="option"
      [attr.aria-selected]="opcion.valor === seleccionada?.valor"
      [attr.aria-disabled]="opcion.deshabilitada || null"
      (click)="elegir(opcion)" (mouseenter)="resaltada.set(i)"
      class="flex cursor-pointer items-center justify-between gap-2 px-3 py-2 text-sm transition"
      [class]="opcion.deshabilitada
        ? 'cursor-not-allowed text-gray-300 dark:text-gray-600'
        : (i === resaltada()
            ? 'bg-brand-50 text-gray-800 dark:bg-white/[0.06] dark:text-white/90'
            : 'text-gray-700 dark:text-gray-300')">
      <span class="min-w-0">
        <span class="block truncate"
          [class.font-medium]="opcion.valor === seleccionada?.valor">{{ opcion.etiqueta }}</span>
        @if (opcion.detalle) {
        <span class="block truncate text-xs text-gray-400 dark:text-gray-500">{{ opcion.detalle }}</span>
        }
      </span>

      @if (opcion.valor === seleccionada?.valor) {
      <svg class="shrink-0 text-brand-500" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        xmlns="http://www.w3.org/2000/svg">
        <path d="m5 13 4 4L19 7" />
      </svg>
      }
    </div>
    } @empty {
    <p class="px-3 py-2 text-sm text-gray-400 dark:text-gray-500">Sin opciones disponibles</p>
    }
  </div>
  }
</div>
