<div class="flex flex-col items-center justify-center px-6 py-16 text-center">
  <span
    class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-400 dark:bg-white/[0.05] dark:text-gray-500"
  >
    @if (porFiltros) {
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    } @else {
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
      <path d="m4 7.5 8 4.5 8-4.5M12 21v-9" />
    </svg>
    }
  </span>

  <h4 class="mb-2 font-semibold text-gray-800 dark:text-white/90">
    {{ porFiltros ? 'Ningún resultado coincide con los filtros' : titulo }}
  </h4>

  @if (descripcion && !porFiltros) {
  <p class="mb-6 max-w-md text-sm text-gray-500 dark:text-gray-400">
    {{ descripcion }}
  </p>
  } @if (porFiltros) {
  <p class="mb-6 max-w-md text-sm text-gray-500 dark:text-gray-400">
    Ajuste o quite los filtros para ver más registros.
  </p>
  }

  @if (textoAccion && !porFiltros) {
  <button
    type="button"
    (click)="accion.emit()"
    class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white transition hover:bg-brand-600"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5v14M5 12h14" />
    </svg>
    {{ textoAccion }}
  </button>
  }
</div>
