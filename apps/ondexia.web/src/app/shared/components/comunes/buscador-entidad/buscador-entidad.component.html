<div class="relative">
  @if (etiqueta) {
  <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
    {{ etiqueta }}
    @if (requerido) {
    <span class="text-error-500">*</span>
    }
  </label>
  }

  <div class="relative">
    <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
    </span>

    <input
      type="text"
      [ngModel]="termino"
      (ngModelChange)="alEscribir($event)"
      (focus)="desplegado = termino.length > 0"
      [placeholder]="marcador"
      [disabled]="deshabilitado"
      autocomplete="off"
      class="h-11 w-full rounded-lg border bg-transparent py-2.5 pl-11 pr-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:outline-hidden focus:ring-3 disabled:cursor-not-allowed disabled:bg-gray-50 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
      [class]="
        error
          ? 'border-error-500 focus:border-error-300 focus:ring-error-500/20 dark:border-error-500'
          : 'border-gray-300 focus:border-brand-300 focus:ring-brand-500/20 dark:border-gray-700 dark:focus:border-brand-800'
      "
    />

    @if (cargando) {
    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400">
      <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" opacity="0.25" />
        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </span>
    }
  </div>

  @if (error) {
  <p class="mt-1.5 text-xs text-error-500">{{ error }}</p>
  }

  @if (desplegado) {
  <div
    class="absolute z-50 mt-1.5 max-h-72 w-full overflow-y-auto rounded-lg border border-gray-200 bg-white py-1.5 shadow-theme-lg dark:border-gray-700 dark:bg-gray-900"
  >
    @if (cargando) {
    <p class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">Buscando…</p>
    } @else if (opciones.length === 0) {
    <p class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">
      Sin coincidencias para «{{ termino }}»
    </p>
    } @else { @for (opcion of opciones; track opcion.id; let i = $index) {
    <button
      type="button"
      (click)="elegir(opcion)"
      [disabled]="opcion.deshabilitada"
      class="flex w-full items-center justify-between gap-3 px-4 py-2.5 text-left transition disabled:cursor-not-allowed disabled:opacity-50"
      [class.bg-gray-50]="i === indiceResaltado"
      [class.dark:bg-white/[0.04]]="i === indiceResaltado"
    >
      <span class="min-w-0">
        <span class="block truncate text-sm text-gray-800 dark:text-white/90">
          {{ opcion.titulo }}
        </span>
        @if (opcion.detalle) {
        <span class="block truncate text-xs text-gray-500 dark:text-gray-400">
          {{ opcion.detalle }}
        </span>
        }
      </span>

      @if (opcion.extremo) {
      <span class="shrink-0 text-sm tabular-nums text-gray-600 dark:text-gray-300">
        {{ opcion.extremo }}
      </span>
      }
    </button>
    } }
  </div>
  }
</div>
