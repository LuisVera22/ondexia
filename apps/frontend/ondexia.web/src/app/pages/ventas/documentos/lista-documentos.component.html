<div>
  <app-encabezado-pagina [titulo]="textos.titulo" [descripcion]="textos.descripcion" />

  @if (puedeEmitir()) {
  <div class="mb-5 flex justify-end">
    <app-boton icono="mas" class="shrink-0" (accion)="nuevaVenta()">Nueva venta</app-boton>
  </div>
  }

  @if (error()) {
  <div class="rounded-base border border-error-500/30 bg-error-500/10 p-4" role="alert"><p class="text-sm text-error-500">{{ error() }}</p></div>
  } @else {
  <app-tabla-datos
    [nombrePlural]="textos.plural"
    [nombreSingular]="textos.singular"
    [acciones]="accionesDeFila"
    campoDescripcion="numero"
    (accionElegida)="ejecutarAccion($event)"
    [cargando]="cargando()"
    (actualizar)="recargar()"
    [columnas]="columnas"
    [registros]="registros()"
    [totalRegistros]="registros().length"
    [vacioTitulo]="'Aún no hay ' + textos.plural"
    vacioDescripcion="Se emiten desde el punto de venta, con una caja abierta."
    [vacioAccion]="puedeEmitir() ? 'Nueva venta' : ''"
    (accionVacio)="nuevaVenta()"
    (filaClic)="abrir($event)"
  />
  }
</div>
