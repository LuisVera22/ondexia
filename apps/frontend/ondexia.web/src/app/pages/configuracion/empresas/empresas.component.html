<div>
  <app-encabezado-pagina
    titulo="Empresas"
    descripcion="Los contribuyentes que emiten con esta cuenta. Abre una para ver sus datos
    fiscales, que son los que se imprimen en cada comprobante."
  />

  <!--
  No hay botón de «Agregar empresa», y no es un olvido: dar de alta un RUC
  afecta a la suscripción y se hace desde la administración de la cuenta.
  Un botón aquí acabaría en un 404 o, peor, en una pantalla que promete
  algo que este módulo no puede cumplir.
  -->

  <!--
    La carga la pinta la propia tabla. Antes se sustituía la tarjeta entera por
    un recuadro con «Cargando…», y eso se lleva por delante el buscador y el
    botón de actualizar justo cuando se están usando: pulsar actualizar hacía
    desaparecer el botón que se acababa de pulsar.
  -->
  @if (error()) {
  <div class="mb-5 flex items-start gap-3 rounded-xl border border-error-500/30 bg-error-500/10 p-4" role="alert">
    <svg class="mt-0.5 shrink-0 text-error-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" />
    </svg>
    <p class="text-sm text-error-500">{{ error() }}</p>
  </div>
  } @else {
  <app-tabla-datos
    [acciones]="accionesDeFila"
    campoDescripcion="razonSocial"
    (accionElegida)="ejecutarAccion($event)"
    [cargando]="cargando()"
    nombrePlural="empresas"
    nombreSingular="empresa"
    (actualizar)="recargar()"
    [columnas]="columnas"
    [registros]="registros()"
    [totalRegistros]="registros().length"
    vacioTitulo="No hay empresas a tu alcance"
    vacioDescripcion="Tu usuario no tiene ninguna empresa asignada. Pídeselo a quien administra la cuenta."
    (filaClic)="abrirFicha($event)"
   />
  }
</div>
