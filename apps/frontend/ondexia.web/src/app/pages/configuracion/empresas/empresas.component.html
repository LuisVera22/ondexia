<div>
  <app-encabezado-pagina titulo="Empresas" />

  <div class="mb-5">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Los contribuyentes que emiten con esta cuenta. Abre una para ver sus datos
      fiscales, que son los que se imprimen en cada comprobante.
      <!--
        No hay botón de «Agregar empresa», y no es un olvido: dar de alta un RUC
        afecta a la suscripción y se hace desde la administración de la cuenta.
        Un botón aquí acabaría en un 404 o, peor, en una pantalla que promete
        algo que este módulo no puede cumplir.
      -->
    </p>
  </div>

  @if (cargando()) {
  <div class="rounded-2xl border border-gray-200 bg-white p-10 text-center dark:border-gray-800 dark:bg-white/[0.03]">
    <p class="text-sm text-gray-500 dark:text-gray-400">Cargando empresas…</p>
  </div>
  } @else if (error()) {
  <div class="mb-5 flex items-start gap-3 rounded-xl border border-error-500/30 bg-error-500/10 p-4" role="alert">
    <svg class="mt-0.5 shrink-0 text-error-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" />
    </svg>
    <p class="text-sm text-error-500">{{ error() }}</p>
  </div>
  } @else {
  <app-tabla-datos
    [columnas]="columnas"
    [registros]="registros()"
    [totalRegistros]="registros().length"
    vacioTitulo="No hay empresas a tu alcance"
    vacioDescripcion="Tu usuario no tiene ninguna empresa asignada. Pídeselo a quien administra la cuenta."
    (filaClic)="abrirFicha($event)"
  >
    <ng-template #acciones let-registro>
      <div class="flex items-center justify-end gap-2">
        @if (registro.enUso) {
        <span class="rounded-full bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">
          En uso
        </span>
        }

        <button
          type="button"
          (click)="abrirFicha(registro)"
          [attr.aria-label]="'Ver los datos de ' + registro.razonSocial"
          class="rounded-lg p-2 text-gray-400 transition hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-white/[0.05]"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="m9 6 6 6-6 6" />
          </svg>
        </button>
      </div>
    </ng-template>
  </app-tabla-datos>
  }
</div>
