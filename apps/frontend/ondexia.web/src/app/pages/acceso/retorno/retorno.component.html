<app-marco-acceso>
  <div class="w-full max-w-md">
    <div class="flex flex-col justify-center">
      @if (error()) {
      <h1 class="mb-2 font-semibold text-gray-800 text-2xl dark:text-white/90">
        No se pudo iniciar sesión
      </h1>

      <div
        class="mb-6 rounded-base border border-error-500/30 bg-error-500/10 px-4 py-3 text-sm text-error-500"
        role="alert"
      >
        {{ error() }}
      </div>

      <a
        routerLink="/acceso/ingresar"
        class="flex h-11 w-full items-center justify-center rounded-base bg-brand-500 text-sm font-medium text-white transition hover:bg-brand-600"
      >
        Volver a intentarlo
      </a>
      } @else {
      <div class="flex flex-col items-center gap-4 text-center">
        <svg class="h-8 w-8 animate-spin text-brand-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
        <p class="text-sm text-gray-500 dark:text-gray-400">Preparando su sesión…</p>
      </div>
      }
    </div>
  </div>
</app-marco-acceso>
