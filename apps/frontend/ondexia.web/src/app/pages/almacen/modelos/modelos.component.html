<div>
  <app-encabezado-pagina titulo="Modelos" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Cada modelo pertenece a una marca. Es un catálogo interno que no se envía a SUNAT.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar modelo
    </button>
  </div>

  <app-tabla-datos
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay modelos"
    vacioDescripcion="Registre primero las marcas y luego los modelos que pertenecen a cada una."
    vacioAccion="Agregar modelo"
   />

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar el modelo?"
    mensaje="Los productos asociados quedarán sin modelo. No se pierde ningún producto."
    textoConfirmar="Confirmar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
