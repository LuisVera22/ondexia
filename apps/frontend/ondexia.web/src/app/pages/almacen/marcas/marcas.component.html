<div>
  <app-encabezado-pagina titulo="Marcas" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Catálogo interno para organizar el inventario. No se envía a SUNAT en el comprobante.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar marca
    </button>
  </div>

  <app-tabla-datos
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay marcas"
    vacioDescripcion="Las marcas ayudan a filtrar y agrupar productos en los listados."
    vacioAccion="Agregar marca"
   />

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar la marca?"
    mensaje="Los productos asociados quedarán sin marca. No se pierde ningún producto."
    textoConfirmar="Confirmar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
