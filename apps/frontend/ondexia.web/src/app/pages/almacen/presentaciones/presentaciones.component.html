<div>
  <app-encabezado-pagina titulo="Presentaciones" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Formas de empaque de un producto. El factor indica cuántas unidades base contiene cada presentación; la base tiene factor 1.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar presentación
    </button>
  </div>

  <app-tabla-datos
    nombrePlural="presentaciones"
    nombreSingular="presentación"
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay presentaciones"
    vacioDescripcion="Las presentaciones permiten vender el mismo producto por unidad, por caja o por paquete."
    vacioAccion="Agregar presentación"
   />

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar la presentación?"
    mensaje="No se puede eliminar la presentación base ni una con existencias registradas."
    textoConfirmar="Confirmar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
