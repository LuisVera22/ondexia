<div>
  <app-encabezado-pagina titulo="Tipos de precio" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Listas de precio por segmento. Al emitir, el tipo asignado al cliente determina qué precio se aplica por defecto.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar tipo de precio
    </button>
  </div>

  <app-tabla-datos
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay tipos de precio"
    vacioDescripcion="Defina al menos un tipo para poder asignar precios a los productos."
    vacioAccion="Agregar tipo de precio"
   />

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar el tipo de precio?"
    mensaje="Se eliminarán los precios de todos los productos asociados a este tipo. Los comprobantes emitidos conservan el precio con el que se emitieron."
    textoConfirmar="Confirmar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
