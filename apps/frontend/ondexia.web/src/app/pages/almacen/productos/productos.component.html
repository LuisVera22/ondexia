<div>
  <app-encabezado-pagina
    titulo="Productos"
    descripcion="El catálogo es de la empresa: código, unidad, afectación al IGV y precio de lista. En qué local se vende, a qué precio y cuánto hay se decide en cada ficha."
  />

  <!--
    Solo el filtro de estado y el boton de crear. El buscador NO va aqui: lo
    trae la tabla, que es donde esta en almacenes, establecimientos, series y
    usuarios. Tener uno propio partia la pantalla en dos cajas que hacian lo
    mismo y dejaba la barra de la tabla medio vacia.

    El estado si se queda fuera, y no por capricho: la busqueda de la tabla es
    texto sobre todas las columnas, y escribir «activo» tambien casa con
    «inactivo». Un desplegable dice exactamente cual de los dos.
  -->
  <div class="mb-5 flex flex-wrap items-center justify-end gap-3">
    <app-desplegable
      idCampo="estado"
      etiquetaAccesible="Filtrar por estado"
      [opciones]="opcionesEstado"
      [(ngModel)]="estadoFiltro"
      class="w-full sm:w-48"
    />
    @if (puedeRegistrar()) {
    <app-boton icono="mas" class="shrink-0" (accion)="nuevo()">Nuevo producto</app-boton>
    }
  </div>

  @if (error()) {
  <div class="flex items-start gap-3 rounded-base border border-error-500/30 bg-error-500/10 p-4" role="alert">
    <p class="text-sm text-error-500">{{ error() }}</p>
  </div>
  } @else {
  <app-tabla-datos
    nombrePlural="productos"
    nombreSingular="producto"
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [cargando]="cargando()"
    (actualizar)="recargar()"
    [columnas]="columnas"
    [registros]="registros"
    [orden]="orden"
    [pagina]="pagina"
    [tamanoPagina]="tamanoPagina"
    [totalRegistros]="registros.length"
    [vacioPorFiltros]="hayFiltrosActivos"
    vacioTitulo="Aún no hay productos"
    vacioDescripcion="Sin productos no hay nada que vender. El primero se ofrece en el establecimiento en el que trabajas."
    [vacioAccion]="puedeRegistrar() ? 'Nuevo producto' : ''"
    (ordenarPor)="orden = $event"
    (cambiarPagina)="pagina = $event"
    (filaClic)="abrirFicha($event)"
    (accionVacio)="nuevo()"
  />
  }
</div>
