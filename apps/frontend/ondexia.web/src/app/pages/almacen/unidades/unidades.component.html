<div>
  <app-encabezado-pagina titulo="Unidades de medida" />

  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="max-w-2xl text-sm text-gray-500 dark:text-gray-400">
      Unidades en que se compran y venden los productos. El código debe corresponder al catálogo nº 03 de SUNAT, que viaja en cada línea del comprobante.
    </p>

    <button
      type="button"
      class="shrink-0 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600"
    >
      Agregar unidad
    </button>
  </div>

  <app-tabla-datos
    [acciones]="accionesDeFila"
    campoDescripcion="nombre"
    (accionElegida)="ejecutarAccion($event)"
    [columnas]="columnas"
    [registros]="registros"
    [totalRegistros]="registros.length"
    vacioTitulo="Aún no hay unidades de medida"
    vacioDescripcion="Sin unidades no es posible registrar productos ni emitir comprobantes."
    vacioAccion="Agregar unidad"
   />

  <app-confirmacion
    [abierto]="confirmacionAbierta"
    [peligrosa]="true"
    titulo="¿Eliminar la unidad de medida?"
    mensaje="No se puede eliminar una unidad usada por productos activos. Los comprobantes emitidos conservan la unidad con la que se emitieron."
    textoConfirmar="Confirmar"
    (confirmar)="eliminar()"
    (cancelar)="confirmacionAbierta = false"
  />
</div>
