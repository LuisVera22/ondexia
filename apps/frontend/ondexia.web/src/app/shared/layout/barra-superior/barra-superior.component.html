<header class="sticky top-0 z-30 flex w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <div class="flex w-full items-center gap-3 px-4 py-3 md:px-6">
    <!-- Plegar el menú -->
    <button
      type="button"
      (click)="alternarMenu()"
      aria-label="Plegar o desplegar el menú"
      class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-gray-200 text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- La marca solo en móvil: en escritorio ya está en el menú lateral -->
    <a routerLink="/" class="shrink-0 xl:hidden" aria-label="Ir al panel">
      <img class="dark:hidden" src="/images/logo/logo.svg" alt="Ondexia" width="120" height="32" />
      <img class="hidden dark:block" src="/images/logo/logo-dark.svg" alt="Ondexia" width="120" height="32" />
    </a>

    <!-- Búsqueda -->
    <div class="relative hidden flex-1 md:block md:max-w-sm">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
      </span>
      <input
        type="search"
        placeholder="Buscar producto, cliente o comprobante…"
        aria-label="Buscar"
        class="h-10 w-full rounded-lg border border-gray-300 bg-transparent pl-10 pr-3 text-dato text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:text-white/90"
      />
    </div>

    <div class="ml-auto flex items-center gap-2 sm:gap-3">
      <!-- Contexto de trabajo: determina la serie del comprobante y el almacén -->
      <app-selector-contexto />

      <!-- Tema -->
      <button
        type="button"
        (click)="tema.alternar()"
        [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-gray-200 text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]"
      >
        @if (tema.tema() === 'oscuro') {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.5" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
        </svg>
        } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
        </svg>
        }
      </button>

      <!-- Menú del usuario -->
      <div class="relative">
        <button
          type="button"
          (click)="alternarMenuUsuario()"
          [attr.aria-expanded]="menuUsuarioAbierto()"
          aria-haspopup="menu"
          aria-label="Menú del usuario"
          class="flex items-center gap-2 rounded-lg p-1 transition hover:bg-gray-50 dark:hover:bg-white/[0.03]"
        >
          <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-brand-500 text-menudo font-semibold text-white">
            {{ iniciales() }}
          </span>
          <span class="hidden text-dato font-medium text-gray-700 dark:text-gray-300 sm:block">
            {{ nombreCorto() }}
          </span>
          <svg
            class="hidden size-4 text-gray-400 transition-transform duration-200 sm:block"
            [class.rotate-180]="menuUsuarioAbierto()"
            width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (menuUsuarioAbierto()) {
        <div
          role="menu"
          class="absolute right-0 top-full z-40 mt-2 w-64 rounded-xl border border-gray-200 bg-white p-2 shadow-flotante dark:border-gray-700 dark:bg-gray-900"
        >
          <div class="border-b border-gray-200 px-3 pb-3 pt-1 dark:border-gray-800">
            <p class="truncate font-medium text-gray-800 dark:text-white/90">{{ nombreCompleto() }}</p>
            <p class="truncate text-menudo text-gray-500 dark:text-gray-400">{{ correo() }}</p>
          </div>

          <ul class="flex flex-col gap-0.5 border-b border-gray-200 py-2 dark:border-gray-800">
            <li>
              <a routerLink="/perfil" (click)="cerrarMenuUsuario()" role="menuitem"
                class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
                <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8.5" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" />
                </svg>
                Mi perfil
              </a>
            </li>
            <li>
              <a routerLink="/configuracion/empresa" (click)="cerrarMenuUsuario()" role="menuitem"
                class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
                <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.14 12.94a1.5 1.5 0 0 1 0-1.88l1.2-1.5-1.74-3-1.83.62a1.5 1.5 0 0 1-1.63-.94L14.5 4.4h-5l-.64 1.84a1.5 1.5 0 0 1-1.63.94l-1.83-.62-1.74 3 1.2 1.5a1.5 1.5 0 0 1 0 1.88l-1.2 1.5 1.74 3 1.83-.62a1.5 1.5 0 0 1 1.63.94l.64 1.84h5l.64-1.84a1.5 1.5 0 0 1 1.63-.94l1.83.62 1.74-3Z" />
                </svg>
                Configuración
              </a>
            </li>
            <li>
              <a routerLink="/configuracion/suscripcion" (click)="cerrarMenuUsuario()" role="menuitem"
                class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
                <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="5.5" width="18" height="13" rx="2.5" /><path d="M3 10h18" />
                </svg>
                Suscripción
              </a>
            </li>
          </ul>

          <!--
            Botón y no enlace. Cerrar sesión no es navegar: hay que borrar los
            tokens de esta pestaña y avisar a Cognito. Sin lo segundo, su cookie
            de sesión sobrevive y volver a «Ingresar» entra solo, sin pedir nada
            — que en un equipo compartido significa que el siguiente usuario
            entra como el anterior.
          -->
          <button type="button" (click)="cerrarSesion()" role="menuitem"
            class="group mt-2 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
            <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 4.75h3.5a1.75 1.75 0 0 1 1.75 1.75v11a1.75 1.75 0 0 1-1.75 1.75H15" />
              <path d="M10 8.5 6.5 12l3.5 3.5M6.5 12H16" />
            </svg>
            Cerrar sesión
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</header>
