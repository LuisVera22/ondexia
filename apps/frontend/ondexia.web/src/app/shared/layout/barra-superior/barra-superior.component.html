<header class="flex w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <div class="flex h-barra w-full items-center gap-3 px-4 md:px-6">
    <!--
      Sin borde, igual que el del tema. Son utilidades, no datos: el borde se
      reserva para el buscador y el selector de contexto, que es lo que hay que
      encontrar primero en esta barra.
    -->
    <!-- Plegar el menú -->
    <button
      type="button"
      (click)="alternarMenu()"
      aria-label="Plegar o desplegar el menú"
      class="flex size-10 shrink-0 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.06] dark:hover:text-gray-200"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!--
      La marca solo en móvil: en escritorio ya está en el menú lateral.

      Y por debajo de 640 px, solo el símbolo. El logotipo completo se lleva 120
      de los 375 px de un teléfono, y lo que queda no alcanza para el contexto
      de trabajo, el tema y la cuenta. El símbolo cuesta 32 y conserva el enlace
      al panel; el nombre completo sigue estando en el menú lateral, que en móvil
      es justo lo que abre el botón de al lado.

      Dos envoltorios y no variantes combinadas en el `class` del `img`:
      `hidden sm:block dark:hidden` deja el resultado a merced del orden en que
      el empaquetador emita las dos reglas, que tienen el mismo peso.
    -->
    <a routerLink="/" class="shrink-0 xl:hidden" aria-label="Ir al panel">
      <span class="block sm:hidden">
        <img src="/images/logo/logo-icon.svg" alt="Ondexia" width="32" height="32" />
      </span>
      <span class="hidden sm:block">
        <img class="dark:hidden" src="/images/logo/logo.svg" alt="Ondexia" width="120" height="32" />
        <img class="hidden dark:block" src="/images/logo/logo-dark.svg" alt="Ondexia" width="120" height="32" />
      </span>
    </a>

    <!--
      Búsqueda desde 1024 y no desde 768: entre esos dos anchos, lo que sobra
      después del contexto, el tema y la cuenta son unos noventa píxeles, y un
      campo de noventa píxeles no es un buscador, es un adorno que estorba.
    -->
    <div class="relative hidden flex-1 lg:block lg:max-w-sm">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
      </span>
      <input
        type="search"
        placeholder="Buscar producto, cliente o comprobante…"
        aria-label="Buscar"
        class="h-10 w-full rounded-lg border border-gray-300 bg-transparent pl-10 pr-3 text-dato text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:text-white/90"
      />
    </div>

    <!--
      Desde 768 px los controles están a la vista. Por debajo no caben: contexto,
      tema y cuenta piden unos 456 px y en un teléfono quedan menos de 200, así
      que se salían de la pantalla y el documento se podía arrastrar en
      horizontal. Ahí bajan todos al botón compacto de al lado.
    -->
    <div class="ml-auto hidden items-center gap-2 md:flex lg:gap-3">
      <!-- Contexto de trabajo: determina la serie del comprobante y el almacén -->
      <app-selector-contexto
        [empresas]="contexto.empresas()"
        [empresaActiva]="contexto.empresaActiva()"
        [establecimientos]="contexto.establecimientos()"
        [establecimientoActivo]="contexto.establecimientoActivo()"
        (cambiarEmpresa)="elegirEmpresa($event)"
        (cambiarEstablecimiento)="contexto.cambiarEstablecimiento($event)"
      />

      <!-- Tema -->
      <button
        type="button"
        (click)="tema.alternar()"
        [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        class="flex size-10 shrink-0 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.06] dark:hover:text-gray-200"
      >
        <ng-container [ngTemplateOutlet]="iconoTema" />
      </button>

      <!--
        La cuenta no es una utilidad más de la fila: el separador la despega de
        lo que se pulsa a diario para no leer cinco controles seguidos como una
        cola sin jerarquia.
      -->
      <span class="mx-0.5 h-6 w-px shrink-0 bg-gray-200 dark:bg-gray-800" aria-hidden="true"></span>

      <!-- Menú del usuario -->
      <div class="relative">
        <button
          type="button"
          (click)="alternarMenuUsuario()"
          [attr.aria-expanded]="menuUsuarioAbierto()"
          aria-haspopup="menu"
          aria-label="Menú del usuario"
          class="flex h-10 items-center gap-2 rounded-lg pl-1 pr-1.5 transition hover:bg-gray-100 dark:hover:bg-white/[0.06]"
        >
          <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-brand-500 text-menudo font-semibold text-white">
            {{ iniciales() }}
          </span>
          <span class="hidden max-w-36 truncate text-dato font-medium text-gray-700 dark:text-gray-300 lg:block">
            {{ nombreCorto() }}
          </span>
          <svg
            class="hidden size-4 text-gray-400 transition-transform duration-200 lg:block"
            [class.rotate-180]="menuUsuarioAbierto()"
            width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (menuUsuarioAbierto()) {
        <div
          role="menu"
          animate.enter="menu-entra"
          class="absolute right-0 top-full z-40 mt-2 w-64 rounded-xl border border-gray-200 bg-white p-2 shadow-flotante dark:border-gray-700 dark:bg-gray-900"
        >
          <ng-container [ngTemplateOutlet]="cuenta" />
        </div>
        }
      </div>
    </div>

    <!--
      Y por debajo de 768, todo detrás de un botón: contexto, tema y cuenta.

      Un solo menú y no tres botones pequeños: en el ancho que queda no caben
      tres, y aunque cupieran, tres iconos de 40 px en la esquina de un teléfono
      son tres objetivos pegados donde el dedo acierta por casualidad.
    -->
    <div class="relative ml-auto md:hidden">
      <button
        type="button"
        (click)="alternarMenuCompacto()"
        [attr.aria-expanded]="menuCompactoAbierto()"
        aria-haspopup="menu"
        aria-label="Contexto, tema y cuenta"
        class="flex size-10 shrink-0 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.06] dark:hover:text-gray-200"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="19" cy="12" r="1.9" />
        </svg>
      </button>

      @if (menuCompactoAbierto()) {
      <!--
        `w-[min(...)]` y no un ancho fijo: con 20rem clavadas, en una pantalla de
        320 px el panel se sale por el lado izquierdo. Y con tope de alto, porque
        una cuenta con varias empresas y varios locales llena la lista y el panel
        crecería por debajo del teléfono.
      -->
      <div
        role="menu"
        animate.enter="menu-entra"
        class="absolute right-0 top-full z-40 mt-2 max-h-[70vh] w-[min(20rem,calc(100vw-2rem))] overflow-y-auto overscroll-contain rounded-xl border border-gray-200 bg-white p-2 shadow-flotante dark:border-gray-700 dark:bg-gray-900"
      >
        <!-- Empresa y local, en vertical porque ya estamos dentro de un menú -->
        <app-selector-contexto
          disposicion="lista"
          [empresas]="contexto.empresas()"
          [empresaActiva]="contexto.empresaActiva()"
          [establecimientos]="contexto.establecimientos()"
          [establecimientoActivo]="contexto.establecimientoActivo()"
          (cambiarEmpresa)="elegirEmpresaYCerrar($event)"
          (cambiarEstablecimiento)="elegirEstablecimientoYCerrar($event)"
        />

        <div class="my-2 border-t border-gray-200 dark:border-gray-800"></div>

        <!--
          `menuitemcheckbox` y no un botón que dice «cambiar a oscuro»: es un
          ajuste con dos estados, y así se anuncia cuál está puesto. No cierra el
          menú al pulsarlo — el cambio se ve detrás, y cerrar obligaría a volver
          a abrirlo para deshacerlo.
        -->
        <button
          type="button"
          role="menuitemcheckbox"
          [attr.aria-checked]="tema.tema() === 'oscuro'"
          (click)="tema.alternar()"
          class="group flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
        >
          <span class="flex size-5 shrink-0 items-center justify-center text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300">
            <ng-container [ngTemplateOutlet]="iconoTema" />
          </span>
          <span class="flex-1">Tema oscuro</span>
          @if (tema.tema() === 'oscuro') {
          <svg class="size-4 shrink-0 text-brand-500" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="m5 12.5 4.5 4.5L19 7" />
          </svg>
          }
        </button>

        <div class="my-2 border-t border-gray-200 dark:border-gray-800"></div>

        <ng-container [ngTemplateOutlet]="cuenta" />
      </div>
      }
    </div>
  </div>
</header>

<!--
  La cuenta, compartida por el menú de escritorio y el compacto de móvil.

  En una plantilla y no copiada en los dos sitios: son los mismos cuatro
  destinos, y duplicarlos significa que dentro de unos meses uno de los dos
  menús tendrá una entrada que el otro no.
-->
<ng-template #cuenta>
  <div class="border-b border-gray-200 px-3 pb-3 pt-1 dark:border-gray-800">
    <p class="truncate font-medium text-gray-800 dark:text-white/90">{{ nombreCompleto() }}</p>
    <p class="truncate text-menudo text-gray-500 dark:text-gray-400">{{ correo() }}</p>
  </div>

  <ul class="flex flex-col gap-0.5 border-b border-gray-200 py-2 dark:border-gray-800">
    <li>
      <a routerLink="/perfil" (click)="cerrarMenus()" role="menuitem"
        class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
        <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8.5" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" />
        </svg>
        Mi perfil
      </a>
    </li>
    <li>
      <a routerLink="/configuracion/empresas" (click)="cerrarMenus()" role="menuitem"
        class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
        <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.14 12.94a1.5 1.5 0 0 1 0-1.88l1.2-1.5-1.74-3-1.83.62a1.5 1.5 0 0 1-1.63-.94L14.5 4.4h-5l-.64 1.84a1.5 1.5 0 0 1-1.63.94l-1.83-.62-1.74 3 1.2 1.5a1.5 1.5 0 0 1 0 1.88l-1.2 1.5 1.74 3 1.83-.62a1.5 1.5 0 0 1 1.63.94l.64 1.84h5l.64-1.84a1.5 1.5 0 0 1 1.63-.94l1.83.62 1.74-3Z" />
        </svg>
        Configuración
      </a>
    </li>
    <li>
      <a routerLink="/configuracion/suscripcion" (click)="cerrarMenus()" role="menuitem"
        class="group flex items-center gap-3 rounded-lg px-3 py-2 text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
        <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5.5" width="18" height="13" rx="2.5" /><path d="M3 10h18" />
        </svg>
        Suscripción
      </a>
    </li>
  </ul>

  <!--
    Botón y no enlace. Cerrar sesión no es navegar: hay que borrar los
    tokens de esta pestaña y avisar a Cognito. Sin lo segundo, su cookie
    de sesión sobrevive y volver a «Ingresar» entra solo, sin pedir nada
    — que en un equipo compartido significa que el siguiente usuario
    entra como el anterior.
  -->
  <button type="button" (click)="cerrarSesion()" role="menuitem"
    class="group mt-2 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-dato font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300">
    <svg class="size-5 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 4.75h3.5a1.75 1.75 0 0 1 1.75 1.75v11a1.75 1.75 0 0 1-1.75 1.75H15" />
      <path d="M10 8.5 6.5 12l3.5 3.5M6.5 12H16" />
    </svg>
    Cerrar sesión
  </button>
</ng-template>

<!-- El mismo par de iconos en el botón de escritorio y en la fila del móvil. -->
<ng-template #iconoTema>
  @if (tema.tema() === 'oscuro') {
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="4.5" />
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
  </svg>
  } @else {
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
  </svg>
  }
</ng-template>
