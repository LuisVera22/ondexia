<div class="relative flex min-h-screen bg-white p-4 dark:bg-gray-950 lg:p-5">
  <!-- Columna del formulario -->
  <div class="flex w-full flex-1 flex-col items-center justify-center px-2 py-10 sm:px-6">
    <ng-content />
  </div>

  <!-- Panel de marca: se retira en pantallas pequeñas -->
  <aside
    class="relative hidden w-1/2 shrink-0 overflow-hidden rounded-3xl bg-gradient-to-br from-brand-500 via-brand-600 to-brand-900 lg:flex lg:flex-col lg:items-center lg:justify-center"
  >
    <!-- Trazado de fondo: líneas suaves que evocan un plano, sin pesar nada -->
    <div
      class="absolute inset-0 opacity-[0.08]"
      aria-hidden="true"
      style="
        background-image:
          linear-gradient(#ffffff 1px, transparent 1px),
          linear-gradient(90deg, #ffffff 1px, transparent 1px);
        background-size: 56px 56px;
      "
    ></div>
    <div
      class="absolute -right-24 -top-24 size-80 rounded-full bg-white/10 blur-3xl"
      aria-hidden="true"
    ></div>
    <div
      class="absolute -bottom-32 -left-16 size-96 rounded-full bg-brand-950/40 blur-3xl"
      aria-hidden="true"
    ></div>

    <div class="relative flex w-full max-w-md flex-col items-center px-10 text-center">
      <!--
        Ilustración propia en SVG: un comprobante aceptado sobre una tarjeta de
        vidrio. Dice qué hace el producto sin cargar una imagen de archivo.
      -->
      <div class="mb-10 w-full rounded-[2rem] border border-white/20 bg-white/10 p-8 shadow-superpuesto backdrop-blur-sm">
        <svg viewBox="0 0 280 190" fill="none" xmlns="http://www.w3.org/2000/svg" class="mx-auto w-full max-w-xs" role="img" aria-label="Comprobante aceptado">
          <!-- Documento -->
          <rect x="70" y="14" width="140" height="162" rx="12" fill="#ffffff" fill-opacity="0.95" />
          <rect x="88" y="34" width="64" height="9" rx="4.5" fill="#465fff" fill-opacity="0.85" />
          <rect x="88" y="52" width="104" height="6" rx="3" fill="#d0d5dd" />
          <rect x="88" y="66" width="88" height="6" rx="3" fill="#d0d5dd" />
          <line x1="88" y1="84" x2="192" y2="84" stroke="#e4e7ec" stroke-width="2" stroke-dasharray="5 5" />
          <rect x="88" y="96" width="56" height="6" rx="3" fill="#98a2b3" />
          <rect x="164" y="96" width="28" height="6" rx="3" fill="#98a2b3" />
          <rect x="88" y="112" width="48" height="6" rx="3" fill="#d0d5dd" />
          <rect x="156" y="112" width="36" height="6" rx="3" fill="#d0d5dd" />
          <rect x="88" y="128" width="52" height="6" rx="3" fill="#d0d5dd" />
          <rect x="160" y="128" width="32" height="6" rx="3" fill="#d0d5dd" />
          <line x1="88" y1="146" x2="192" y2="146" stroke="#e4e7ec" stroke-width="2" />
          <rect x="88" y="156" width="40" height="8" rx="4" fill="#344054" />
          <rect x="152" y="156" width="40" height="8" rx="4" fill="#465fff" />
          <!-- Barras: la parte de gestión -->
          <rect x="22" y="118" width="14" height="40" rx="4" fill="#ffffff" fill-opacity="0.35" />
          <rect x="42" y="98" width="14" height="60" rx="4" fill="#ffffff" fill-opacity="0.55" />
          <rect x="62" y="76" width="14" height="82" rx="4" fill="#ffffff" fill-opacity="0.8" transform="translate(-8 0)" />
          <!-- Sello de aceptado -->
          <circle cx="212" cy="42" r="26" fill="#12b76a" />
          <circle cx="212" cy="42" r="26" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" />
          <path d="m201 42.5 7.5 7.5 14-15" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- Mensajes rotatorios -->
      <h2 class="mb-2 text-2xl font-semibold text-white">
        {{ mensajes[mensajeActivo()].titulo }}
      </h2>
      <p class="mb-8 min-h-10 text-dato text-brand-100">
        {{ mensajes[mensajeActivo()].detalle }}
      </p>

      <!-- Puntos del carrusel: controles de verdad, no adorno -->
      <div class="flex items-center gap-2" role="tablist" aria-label="Mensajes">
        @for (mensaje of mensajes; track $index) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="mensajeActivo() === $index"
          [attr.aria-label]="mensaje.titulo"
          (click)="elegirMensaje($index)"
          class="h-2 rounded-full transition-all duration-300"
          [class]="mensajeActivo() === $index ? 'w-7 bg-white' : 'w-2 bg-white/40 hover:bg-white/60'"
        ></button>
        }
      </div>
    </div>
  </aside>

  <!-- El tema también se alterna aquí: quien entra de noche no debería tragarse
       una pantalla blanca para luego cambiarlo dentro. -->
  <button
    type="button"
    (click)="tema.alternar()"
    [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    class="fixed bottom-6 right-6 z-50 flex size-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-elevado transition hover:text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
  >
    @if (tema.tema() === 'oscuro') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
    </svg>
    } @else {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
    </svg>
    }
  </button>
</div>
