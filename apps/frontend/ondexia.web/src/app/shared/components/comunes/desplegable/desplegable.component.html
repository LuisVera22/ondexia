<div class="relative">
  <!--
    El borde y la altura son clases propias conmutadas con `[class.x]`, no
    utilidades dentro de un `[class]="…"`: Tailwind no detecta las clases que
    solo viven en una expresión y la regla nunca llega a generarse. Ver
    styles.css.
  -->
  <button #disparador type="button" [id]="idCampo || null" [disabled]="deshabilitado"
    [class.abierto]="abierto()" [class.compacto]="alto === 'compacto'" [class.formulario]="alto === 'formulario'"
    (click)="alternar()" (keydown)="alTeclear($event)"
    role="combobox" aria-haspopup="listbox"
    [attr.aria-expanded]="abierto()"
    [attr.aria-controls]="idBase + '-panel'"
    [attr.aria-activedescendant]="abierto() ? idOpcionResaltada : null"
    [attr.aria-label]="etiquetaAccesible || null"
    class="campo-desplegable flex w-full items-center justify-between gap-2 rounded-lg border bg-transparent text-left text-sm transition focus:outline-hidden focus:ring-3 focus:ring-brand-500/20 disabled:cursor-not-allowed disabled:opacity-50">
    <span class="truncate" [class.text-gray-400]="!haySeleccion"
      [class.text-gray-800]="haySeleccion" [class.dark:text-white/90]="haySeleccion">
      {{ textoVisible }}
    </span>

    <svg class="shrink-0 text-gray-400 transition-transform duration-200"
      [class.rotate-180]="abierto()"
      width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (abierto()) {
  <div #panel [id]="idBase + '-panel'" role="listbox" [style]="posicion()"
    [attr.aria-label]="etiquetaAccesible || null"
    class="z-9999 overflow-y-auto rounded-lg border border-gray-200 bg-white py-1 shadow-flotante dark:border-gray-700 dark:bg-gray-900">
    @for (opcion of opciones; track opcion.valor; let i = $index) {
    <div [id]="idOpcion(i)" role="option"
      [attr.aria-selected]="opcion.valor === seleccionada?.valor"
      [attr.aria-disabled]="opcion.deshabilitada || null"
      [class.resaltada]="i === resaltada() && !opcion.deshabilitada"
      [class.inhabilitada]="opcion.deshabilitada"
      (click)="elegir(opcion)" (mouseenter)="resaltada.set(i)"
      class="opcion-desplegable flex cursor-pointer items-center justify-between gap-2 px-3 py-2 text-sm transition">
      <span class="min-w-0">
        <span class="block truncate"
          [class.font-medium]="opcion.valor === seleccionada?.valor">{{ opcion.etiqueta }}</span>
        @if (opcion.detalle) {
        <span class="block truncate text-xs text-gray-400 dark:text-gray-500">{{ opcion.detalle }}</span>
        }
      </span>

      @if (opcion.valor === seleccionada?.valor) {
      <svg class="shrink-0 text-brand-500" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        xmlns="http://www.w3.org/2000/svg">
        <path d="m5 13 4 4L19 7" />
      </svg>
      }
    </div>
    } @empty {
    <p class="px-3 py-2 text-sm text-gray-400 dark:text-gray-500">Sin opciones disponibles</p>
    }
  </div>
  }
</div>
