@if (abierto) {
<div class="fixed inset-0 z-99999 flex items-center justify-center p-5">
  <div
    class="absolute inset-0 bg-gray-900/50 backdrop-blur-[2px]"
    (click)="cancelar.emit()"
  ></div>

  <div
    role="alertdialog"
    aria-modal="true"
    class="relative w-full max-w-[480px] rounded-2xl bg-white p-6 shadow-flotante dark:bg-gray-900 sm:p-8"
  >
    <div class="flex gap-4">
      <span
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full"
        [class]="
          peligrosa
            ? 'bg-error-50 text-error-500 dark:bg-error-500/15'
            : 'bg-warning-50 text-warning-500 dark:bg-warning-500/15'
        "
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 8.5v4.5M12 16.5h.01" />
          <path d="M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0Z" />
        </svg>
      </span>

      <div class="min-w-0">
        <h4 class="mb-2 font-semibold text-gray-800 dark:text-white/90">
          {{ titulo }}
        </h4>
        @if (mensaje) {
        <p class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
          {{ mensaje }}
        </p>
        }
      </div>
    </div>

    <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancelar.emit()"
        [disabled]="procesando"
        class="rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50 disabled:opacity-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-white/[0.03]"
      >
        {{ textoCancelar }}
      </button>

      <button
        type="button"
        (click)="confirmar.emit()"
        [disabled]="procesando"
        class="rounded-lg px-4 py-2.5 text-sm font-medium text-white transition disabled:opacity-50"
        [class]="
          peligrosa
            ? 'bg-error-500 hover:bg-error-600'
            : 'bg-brand-500 hover:bg-brand-600'
        "
      >
        {{ procesando ? 'Procesando…' : textoConfirmar }}
      </button>
    </div>
  </div>
</div>
}
