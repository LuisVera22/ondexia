<!--
  Se construye sobre app-modal en vez de tener su propio diálogo. La API pública
  no cambió al hacerlo —las catorce pantallas que ya lo usan siguen igual— pero
  el cierre con Escape, la retención del foco y el bloqueo del desplazamiento
  dejan de estar escritos dos veces.

  rol="alertdialog" y no "dialog": esto interrumpe a propósito, porque lo que se
  va a confirmar es irreversible.
-->
<app-modal
  [abierto]="abierto"
  [rol]="'alertdialog'"
  ancho="estrecho"
  [cerrable]="false"
  [procesando]="procesando"
  (cerrar)="cancelar.emit()"
>
  <div class="flex gap-4">
    <span
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full"
      [class]="
        peligrosa
          ? 'bg-error-50 text-error-500 dark:bg-error-500/15'
          : 'bg-warning-50 text-warning-500 dark:bg-warning-500/15'
      "
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 8.5v4.5M12 16.5h.01" />
        <path d="M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3.1L13.7 3.9a2 2 0 0 0-3.4 0Z" />
      </svg>
    </span>

    <div class="min-w-0">
      <h4 class="mb-2 font-semibold text-gray-800 dark:text-white/90">
        {{ titulo }}
      </h4>
      @if (mensaje) {
      <p class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
        {{ mensaje }}
      </p>
      }
    </div>
  </div>

  <ng-container acciones>
    <app-boton variante="secundario" [deshabilitado]="procesando" (accion)="cancelar.emit()">
      {{ textoCancelar }}
    </app-boton>

    <app-boton
      [variante]="peligrosa ? 'peligro' : 'primario'"
      [estado]="procesando ? 'cargando' : 'reposo'"
      (accion)="confirmar.emit()"
    >
      {{ textoConfirmar }}
    </app-boton>
  </ng-container>
</app-modal>
