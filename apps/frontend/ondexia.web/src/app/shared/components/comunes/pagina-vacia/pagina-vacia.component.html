<div class="flex flex-col items-center justify-center px-6 py-16 text-center">
  <span
    class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-400 dark:bg-white/[0.05] dark:text-gray-500"
  >
    @if (porFiltros) {
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    } @else {
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
      <path d="m4 7.5 8 4.5 8-4.5M12 21v-9" />
    </svg>
    }
  </span>

  <!--
    Los textos vienen siempre de fuera, también con `porFiltros`. Antes esta
    rama los ignoraba y escribía uno genérico —«Ningún resultado coincide con
    los filtros»—, así que quien buscaba no podía saber qué se buscó: el campo
    puede haber quedado fuera de la vista al vaciarse la tabla. Se conserva un
    texto por defecto para quien no pase ninguno.
  -->
  <h4 class="mb-2 font-semibold text-gray-800 dark:text-white/90">
    {{ titulo }}
  </h4>

  @if (descripcion) {
  <p class="mb-6 max-w-md text-sm text-gray-500 dark:text-gray-400">
    {{ descripcion }}
  </p>
  }

  @if (textoAccion) {
  <button
    type="button"
    (click)="accion.emit()"
    class="inline-flex items-center gap-2 rounded-lg px-4 py-3 text-sm font-medium transition"
    [class]="
      porFiltros
        ? 'border border-gray-300 text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/[0.03]'
        : 'bg-brand-500 text-white hover:bg-brand-600'
    "
  >
    <!--
      El aspa y no el más cuando es por filtros: la acción es deshacer lo que
      dejó la tabla vacía, no crear nada. Y va en secundario, porque es un paso
      atrás y no lo siguiente que hay que hacer.
    -->
    @if (porFiltros) {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
      <path d="m6 6 12 12M18 6 6 18" />
    </svg>
    } @else {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5v14M5 12h14" />
    </svg>
    }
    {{ textoAccion }}
  </button>
  }
</div>
