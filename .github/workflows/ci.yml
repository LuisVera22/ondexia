name: CI

# GitFlow: se construye en las dos ramas de larga vida y en toda rama de
# trabajo (feature, release, hotfix), para que nada llegue roto a `develop`.
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un solo job, sin filtros de rutas. Con un desarrollador y un proyecto de este
# tamaño, construir todo en cada commit cuesta minutos y ahorra la clase de
# error que aparece cuando el frontend y el backend se compilan por separado.
# Si algún día el build molesta por lento, ahí se agregan filtros — no antes.
jobs:
  build:
    runs-on: ubuntu-latest
    # 30 y no 20: `verify` levanta un contenedor de PostgreSQL para las pruebas
    # de integración, y la primera sincronización de la base de la NVD, cuando
    # haya clave, no es instantánea.
    timeout-minutes: 30

    steps:
      # Las versiones de las acciones se subieron todas de golpe porque GitHub
      # está retirando Node 20 y las majors anteriores corren sobre él: hoy sale
      # un aviso y el día que retiren el runtime dejan de ejecutarse. Se fijan a
      # la major, no al SHA — con un solo desarrollador, el coste de revisar cada
      # parche a mano supera al riesgo de que una acción oficial se corrompa.
      #
      # De los cambios incompatibles, solo uno nos rozaba: checkout v7 deja de
      # descargar el código de PR desde bifurcaciones cuando el disparador es
      # `pull_request_target` o `workflow_run`. Aquí no aplica —el CI se dispara
      # con `push` y `pull_request`— y además es la clase de protección que
      # queremos, porque ese patrón es justo el que filtra secretos a una PR
      # ajena.
      - uses: actions/checkout@v7

      # pnpm antes que setup-node: el runner no lo trae, y setup-node necesita
      # que exista para poder cachear su almacén.
      #
      # `package_json_file` hace falta porque la acción busca `packageManager`
      # en la RAÍZ del repositorio, y aquí no hay package.json ahí: el frontend
      # cuelga de apps/frontend/ondexia.web. Sin esta línea falla en ocho
      # segundos con «No pnpm version is specified», antes de compilar nada, y
      # el mensaje no menciona que el problema sea dónde está mirando.
      #
      # Se apunta al archivo en vez de fijar `version:` aquí para que la versión
      # siga estando en un solo sitio. Con las dos, la del workflow y la del
      # package.json se separan el día que alguien actualice una.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/ondexia.web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/frontend/ondexia.web/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Cada paso se salta solo mientras el módulo no exista (Fase 0).
      # Así el pipeline está listo desde hoy sin fallar en rojo por lo que
      # todavía no se ha escrito.

      - name: Frontend
        if: hashFiles('apps/frontend/ondexia.web/package.json') != ''
        working-directory: apps/frontend/ondexia.web
        # pnpm, no npm: el proyecto migró y `package-lock.json` ya no existe,
        # así que `npm ci` fallaba en cada ejecución. `--frozen-lockfile` es el
        # equivalente de `npm ci` — se niega a instalar si el lockfile no
        # concuerda con el package.json, en vez de resolverlo por su cuenta y
        # construir con versiones distintas a las de tu máquina.
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run test:ci

      # La base de vulnerabilidades del NIST, en su propia cache.
      #
      # Vivia dentro de la cache de Maven, que se indexa por el hash de los
      # pom.xml. Consecuencia: cualquier cambio en un pom —anadir un modulo,
      # subir una version— invalidaba la cache y obligaba a bajar los 377.000
      # registros otra vez. Son quince minutos, y quince minutos colgados de un
      # servicio externo que puede fallar:
      #
      #   NvdApiException: NVD Returned Status Code: 524
      #   NoDataException: No documents exist
      #
      # Ese 524 es un tiempo de espera del Cloudflare de la NVD, no algo nuestro.
      # Lo que si era nuestro es no tener de donde tirar cuando ocurre.
      #
      # La clave lleva el id de la ejecucion para guardar siempre una copia
      # fresca, y `restore-keys` recupera la mas reciente aunque no coincida
      # exactamente. Asi la base sobrevive a los cambios de pom.
      - name: Cache de la base de vulnerabilidades
        if: hashFiles('apps/backend/pom.xml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # La landing no comparte nada con los otros dos: es Astro, no Angular, y
      # no tiene cache que envenenar ni pruebas todavia. `astro check` corre
      # dentro de `build` y valida los tipos de las plantillas, que es lo unico
      # que hay que verificar en una pagina estatica.
      - name: Landing
        if: hashFiles('apps/frontend/ondexia.landing/package.json') != ''
        working-directory: apps/frontend/ondexia.landing
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Panel interno
        if: hashFiles('apps/frontend/ondexia.admin/package.json') != ''
        working-directory: apps/frontend/ondexia.admin
        run: |
          pnpm install --frozen-lockfile
          rm -rf .angular/cache
          pnpm run build
          pnpm run test:ci

      - name: Backend
        if: hashFiles('apps/backend/pom.xml') != ''
        working-directory: apps/backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Con el wrapper, no con el `mvn` del runner: fija la versión de Maven
        # en el repositorio, de modo que CI y la máquina de desarrollo
        # construyen con la misma. `verify` incluye las pruebas de integración,
        # que levantan PostgreSQL con Testcontainers — el runner de GitHub trae
        # Docker.
        #
        # OWASP Dependency-Check necesita una clave de API del NIST. Sin ella la
        # NVD limita las peticiones hasta hacer el análisis inviable en un
        # pipeline: la primera sincronización pasa de minutos a horas. Es
        # gratuita — https://nvd.nist.gov/developers/request-an-api-key — y se
        # guarda como secreto `NVD_API_KEY` del repositorio.
        #
        # Mientras no exista, se omite con un aviso visible en vez de dejar el
        # build colgado hasta agotar el tiempo. Un control de seguridad que
        # nadie puede ejecutar acaba desactivado de todas formas; mejor que
        # conste que está desactivado.
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=Análisis de dependencias omitido::Falta el secreto NVD_API_KEY. OWASP Dependency-Check no se ejecutó. Pídela en https://nvd.nist.gov/developers/request-an-api-key"
            ./mvnw -B verify -Ddependency-check.skip=true
          else
            ./mvnw -B verify -Ddependency-check.nvdApiKey="$NVD_API_KEY"
          fi

      # El informe de Dependency-Check, pase o falle el build.
      #
      # Sin esto, cuando el análisis rompe el build lo único que queda es la lista
      # del log, que GitHub corta por la derecha justo donde están los
      # identificadores de CVE y sus puntuaciones. Se puede diagnosticar a ciegas
      # o se puede leer el informe; esto es lo segundo.
      #
      # `if: always()` es el punto entero: el caso en que hace falta es
      # precisamente el que aborta el job.
      - name: Publicar el informe de dependencias
        if: always() && hashFiles('apps/backend/ondexia.api/target/dependency-check-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: apps/backend/**/target/dependency-check-report.*
          retention-days: 14

      # DT-16 sustituyó AWS CDK por Terraform. Este paso buscaba
      # ondexia.infra/package.json y ejecutaba `cdk synth`: no se disparaba
      # nunca y no validaba nada.
      - uses: hashicorp/setup-terraform@v4
        if: hashFiles('ondexia.infra/versions.tf') != ''
        with:
          terraform_version: '1.15.8'

      - name: Infraestructura
        if: hashFiles('ondexia.infra/versions.tf') != ''
        working-directory: ondexia.infra
        # -backend=false: no se contacta con S3 ni hacen falta credenciales de
        # AWS. Comprueba la sintaxis, los tipos y las referencias entre
        # recursos, que es lo que puede romperse en un commit. Lo que NO
        # comprueba es si los recursos existen o si la cuenta los admite; para
        # eso hace falta un `plan`, y un `plan` en CI exige credenciales.
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
