name: Deploy

# INACTIVO HASTA FASE 1 (DTE §10.3): solo se dispara a mano.
#
# Al llegar la Fase 1, activar el disparador automático según GitFlow:
#   push a develop -> entorno dev
#   push a main    -> entorno prod (con aprobación manual del environment)
#
# Se deja manual a propósito mientras no haya nada desplegado: un workflow de
# despliegue que apunta a nada solo produce fallos rojos que enseñan a ignorar
# el tablero.
#
# on:
#   push:
#     branches: [main, develop]
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno destino
        required: true
        type: choice
        options: [dev, prod]
      solo_plan:
        description: Solo mostrar el plan, sin aplicar
        type: boolean
        default: false

# Sin claves de larga vida: GitHub pide un token OIDC y AWS lo canjea por
# credenciales temporales contra un rol que confía en este repositorio
# (doc 03 §9.2).
permissions:
  id-token: write
  contents: read

concurrency:
  # Dos `apply` simultáneos sobre el mismo estado es la forma más rápida de
  # corromperlo. `cancel-in-progress: false` es deliberado: cancelar un apply a
  # medias deja recursos creados que el estado no conoce.
  group: deploy-${{ inputs.entorno }}
  cancel-in-progress: false

env:
  REGION: us-east-1
  TERRAFORM_VERSION: '1.15.8'

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # El entorno `prod` debe configurarse en GitHub con revisor requerido: esa
    # es la aprobación manual que exige el DTE §10.2. No es burocracia — un
    # despliegue defectuoso genera comprobantes inválidos con consecuencias
    # fiscales para el cliente.
    environment: ${{ inputs.entorno }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # ── Herramientas ───────────────────────────────────────────────────────

      # `package_json_file` por lo mismo que en ci.yml: la acción busca
      # `packageManager` en la raíz del repositorio y el frontend cuelga de
      # apps/frontend/ondexia.web. Sin esto el despliegue muere antes de
      # empezar, con un error que no dice dónde estaba buscando.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/ondexia.web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/frontend/ondexia.web/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # Sin envoltorio: interfiere al leer la salida de `terraform output`
          # desde los pasos siguientes.
          terraform_wrapper: false

      - name: Asumir rol de despliegue
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      # ── Construcción ───────────────────────────────────────────────────────
      #
      # Se construye ANTES de tocar la infraestructura. Si el frontend no
      # compila, conviene enterarse antes de haber modificado nada en AWS y no
      # con la mitad del despliegue hecha.

      # Ver el comentario equivalente en ci.yml: sin esto, cada cambio de pom
      # obliga a bajar los 377.000 registros de la NVD otra vez.
      - name: Cache de la base de vulnerabilidades
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Verificar el backend
        working-directory: apps/backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # `verify` incluye las pruebas de integración, que levantan PostgreSQL
        # con Testcontainers. Se repiten aquí aunque el CI ya las haya corrido
        # porque este workflow se dispara a mano desde cualquier rama: nada
        # garantiza que este commit pasara por CI. En un sistema que emite
        # documentos con valor tributario, esa garantía no se asume.
        #
        # Sobre NVD_API_KEY, ver el comentario equivalente en ci.yml.
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=Análisis de dependencias omitido::Falta el secreto NVD_API_KEY."
            ./mvnw -B verify -Ddependency-check.skip=true
          else
            ./mvnw -B verify -Ddependency-check.nvdApiKey="$NVD_API_KEY"
          fi

      - name: Construir el frontend
        working-directory: apps/frontend/ondexia.web
        run: |
          pnpm install --frozen-lockfile
          # Caché de Angular fuera antes de construir. Una caché envenenada
          # produce un CSS sin las utilidades de Tailwind: el build pasa en
          # verde, el bundle es válido y la aplicación sale SIN ESTILOS. En CI
          # el runner es limpio, pero este workflow tambien se dispara a mano.
          rm -rf .angular/cache
          pnpm run build

      - name: Construir el panel interno
        working-directory: apps/frontend/ondexia.admin
        run: |
          pnpm install --frozen-lockfile
          rm -rf .angular/cache
          pnpm run build

      - name: Comprobar que el CSS trae los estilos
        working-directory: apps/frontend/ondexia.web
        # El fallo que motiva esto no rompe nada que un build sepa detectar: el
        # CSS se genera, pesa lo razonable y es sintacticamente correcto — solo
        # que contiene el tema y ninguna utilidad. Se descubre mirando la
        # pagina, que es tarde.
        #
        # Dos senales: que exista alguna utilidad, y que no quede un @theme sin
        # compilar (Tailwind lo convierte en variables sobre :root; si sobrevive
        # literal, es que nunca proceso el archivo).
        run: |
          CSS=$(ls dist/ondexia-web/browser/styles-*.css)
          echo "Revisando ${CSS}"

          if ! grep -q "display:flex" "$CSS"; then
            echo "::error title=CSS sin utilidades::Tailwind no genero utilidades. Revisa .postcssrc.json y borra .angular/cache."
            exit 1
          fi

          if grep -q "@theme" "$CSS"; then
            echo "::error title=CSS sin compilar::Queda un @theme literal: Tailwind no proceso styles.css."
            exit 1
          fi

          echo "CSS correcto: $(wc -c < "$CSS") bytes."

      # ── Infraestructura ────────────────────────────────────────────────────

      - name: Resolver el bucket del estado
        # El nombre lo fija bootstrap/ como ondexia-tfstate-<cuenta>, así que se
        # deriva en vez de guardarse en una variable que puede quedar
        # desincronizada del bucket real.
        run: |
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET_ESTADO=ondexia-tfstate-${CUENTA}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ondexia.infra
        # La clave del estado LLEVA EL ENTORNO. Con una clave fija, `dev` y
        # `prod` compartirían estado y el primer despliegue de `dev` se llevaría
        # por delante producción. Ver el comentario en versions.tf.
        run: |
          terraform init \
            -backend-config="bucket=${BUCKET_ESTADO}" \
            -backend-config="key=ondexia/${{ inputs.entorno }}/terraform.tfstate" \
            -backend-config="region=${REGION}"

      # ── Migraciones, ANTES de publicar la API ──────────────────────────────
      #
      # El orden de estos dos pasos importa y costó descubrirlo.
      #
      # La API corre con ddl-auto=validate: al arrancar comprueba que cada
      # entidad tenga su tabla. Publicar una versión con una entidad nueva
      # ANTES de aplicar su migración hace que el arranque falle con
      # «Schema validation: missing table», y como SnapStart toma la instantánea
      # durante ese arranque, la versión queda en estado Failed. El alias no
      # puede apuntar a una versión fallida, así que el despliegue se detiene
      # con la API sirviendo todavía el código anterior.
      #
      # Por eso se actualiza primero SOLO la función de migraciones —que no
      # levanta Hibernate y por tanto no valida nada—, se migra, y solo entonces
      # se aplica el resto.

      - name: Actualizar la función de migraciones
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        # -target está desaconsejado como norma y aquí es lo correcto: se
        # necesita justamente aplicar una parte antes que el resto.
        run: |
          terraform apply -auto-approve \
            -var-file="entornos/${{ inputs.entorno }}.tfvars" \
            -target=aws_s3_object.api \
            -target=aws_lambda_function.migraciones

      - name: Aplicar las migraciones
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        run: |
          FUNCION=$(terraform output -raw funcion_migraciones)

          if [ -z "$FUNCION" ]; then
            echo "Sin artefacto de backend: no hay migraciones que aplicar."
            exit 0
          fi

          aws lambda invoke \
            --function-name "$FUNCION" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            respuesta.json > invocacion.json

          # Una invocación con error devuelve HTTP 200 con FunctionError dentro.
          # Sin esta comprobación, una migración fallida pasa por buena.
          if jq -e '.FunctionError' invocacion.json > /dev/null; then
            echo "::error title=Migración fallida::$(cat respuesta.json)"
            exit 1
          fi

          echo "$(cat respuesta.json)" >> "$GITHUB_STEP_SUMMARY"

      # ── Infraestructura, ya con el esquema al día ──────────────────────────

      # El plan se calcula AQUÍ y no antes de las migraciones, y el motivo es
      # que un plan guardado caduca.
      #
      # Terraform anota en el archivo del plan el serial del estado con el que lo
      # calculó, y `apply plan.tfplan` se niega a aplicarlo si el estado avanzó
      # desde entonces: «Saved plan is stale». El paso de migraciones aplica dos
      # recursos con -target, así que el estado avanza justo en medio — planificar
      # antes producía un plan condenado a rechazarse.
      #
      # Calculándolo después se arreglan las dos cosas a la vez: el plan ya no
      # caduca, y deja de incluir dos recursos que se aplicaron por adelantado y
      # que había que explicar en el resumen como «ya están en su estado
      # deseado».
      - name: Terraform plan
        working-directory: ondexia.infra
        run: |
          terraform plan \
            -var-file="entornos/${{ inputs.entorno }}.tfvars" \
            -out=plan.tfplan
          terraform show -no-color plan.tfplan > plan.txt

      - name: Publicar el plan en el resumen
        working-directory: ondexia.infra
        # Queda en la página de la ejecución. Con un solo operador (R-13) no hay
        # un segundo par de ojos, así que el plan legible después del hecho es
        # lo más parecido a una revisión que existe.
        run: |
          {
            echo "## Plan · ${{ inputs.entorno }}"
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        # Se aplica el plan guardado, no se recalcula. Un `apply` que vuelve a
        # planificar puede hacer algo distinto de lo que se revisó, y en prod hay
        # una aprobación humana de por medio.
        run: terraform apply -auto-approve plan.tfplan

      # ── Publicación del contenido estático ─────────────────────────────────
      #
      # Después del apply: los buckets y las distribuciones tienen que existir.

      - name: Publicar la SPA
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        run: |
          BUCKET=$(terraform output -json buckets | jq -r .app)
          DISTRIBUCION=$(terraform output -json distribuciones_cloudfront | jq -r .app)

          # --delete retira lo que ya no está en el build. Sin él, los ficheros
          # con hash de versiones anteriores se acumulan para siempre.
          aws s3 sync ../apps/frontend/ondexia.web/dist/ondexia-web/browser \
            "s3://${BUCKET}" --delete

          # index.html sin caché, el resto un año. Los nombres de los bundles
          # llevan hash, así que son inmutables; index.html es el único que
          # cambia de contenido con el mismo nombre, y si se cachea el usuario
          # sigue cargando la versión anterior indefinidamente.
          aws s3 cp "s3://${BUCKET}/index.html" "s3://${BUCKET}/index.html" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUCION}" \
            --paths "/index.html" "/"

      - name: Publicar el panel interno
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        run: |
          BUCKET=$(terraform output -json buckets | jq -r .panel)
          DISTRIBUCION=$(terraform output -json distribuciones_cloudfront | jq -r .panel)
          DESTINO=../apps/frontend/ondexia.admin/dist/ondexia-admin/browser

          # La configuracion la produce Terraform y se escribe DESPUES del build:
          # asi el artefacto no lleva dentro ninguna URL y el mismo build vale
          # para dev y para prod.
          terraform output -json configuracion_panel > "${DESTINO}/config.json"

          aws s3 sync "${DESTINO}" "s3://${BUCKET}" --delete

          aws s3 cp "s3://${BUCKET}/index.html" "s3://${BUCKET}/index.html"             --metadata-directive REPLACE             --cache-control "no-cache, no-store, must-revalidate"             --content-type "text/html; charset=utf-8"

          # config.json tampoco se cachea: es lo que apunta a la API y a Cognito.
          aws s3 cp "s3://${BUCKET}/config.json" "s3://${BUCKET}/config.json"             --metadata-directive REPLACE             --cache-control "no-cache, no-store, must-revalidate"             --content-type "application/json"

          aws cloudfront create-invalidation             --distribution-id "${DISTRIBUCION}" --paths "/*" > /dev/null

      - name: Comprobar que responde
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        # Una comprobación de humo, no una suite. Responde a la única pregunta
        # que importa justo después de desplegar: ¿está en pie lo que acabo de
        # publicar? Sin esto, el workflow puede terminar en verde con la API
        # caída.
        run: |
          API=$(terraform output -raw url_api)
          echo "Sondeando ${API}/salud"

          for intento in $(seq 1 10); do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "${API}/salud" || true)
            if [ "$CODIGO" = "200" ]; then
              echo "La API responde."
              exit 0
            fi
            echo "  intento ${intento}: HTTP ${CODIGO}"
            sleep 10
          done

          echo "::error::La sonda de vida no respondió 200 tras 10 intentos."
          exit 1

      - name: Recordatorios
        if: ${{ !inputs.solo_plan }}
        working-directory: ondexia.infra
        # Lo que Terraform no puede hacer por ti. Se imprime en cada despliegue
        # porque son cosas que se olvidan justo cuando importan — una alarma que
        # no avisa a nadie no se descubre hasta que hace falta.
        run: |
          {
            echo "## Pendiente de hacer a mano"
            terraform output -json recordatorios | jq -r '.[] | "- \(.)"'
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | $(terraform output -raw url_app) |"
            echo "| API | $(terraform output -raw url_api) |"
          } >> "$GITHUB_STEP_SUMMARY"
