# GENERADO AUTOMATICAMENTE — no editar a mano.
#
# Lo escribe ExportarContratoIT en cada ejecucion de la suite, a partir de los
# controladores de ondexia-api. Si este archivo aparece modificado en git status,
# es porque la API cambio: revisa el diff antes de confirmar, porque de aqui se
# genera el cliente Angular.
#
# Regenerar:  cd apps/backend && ./mvnw test
#
# El -am de "-pl ondexia.api -am" no es opcional si acotas el modulo: sin el,
# Maven no construye ondexia-domain y la resolucion falla.
openapi: 3.0.1
info:
  title: Ondexia — API Core
  description: |-
    Nucleo comercial: almacen, compras, ventas y configuracion.

    Esta API no habla con SUNAT. La emision de comprobantes se publica en una cola y la atiende ondexia-facturacion (DTE §3.3).
  version: 0.1.0
servers:
- url: http://localhost
  description: Generated server url
security:
- jwt: []
tags:
- name: Empresa
  description: Datos fiscales de la empresa activa
- name: Contexto
  description: "Identidad, empresas accesibles y permisos efectivos"
- name: Registro
  description: "Alta de cuenta, empresa y primer administrador"
- name: Establecimientos
  description: Anexos de la empresa ante SUNAT
paths:
  /api/v1/configuracion/establecimientos/{id}:
    put:
      tags:
      - Establecimientos
      summary: Actualiza un establecimiento
      description: "El código no se puede cambiar: identifica al anexo ante SUNAT."
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEdicion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEstablecimiento"
    delete:
      tags:
      - Establecimientos
      summary: Desactiva un establecimiento
      description: "No lo borra. Un establecimiento aparece en los comprobantes ya\
        \ emitidos: borrarlo dejaría documentos apuntando a nada."
      operationId: desactivar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/configuracion/empresa:
    get:
      tags:
      - Empresa
      summary: Datos de la empresa activa
      operationId: consultar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
    put:
      tags:
      - Empresa
      summary: Actualiza los datos fiscales
      description: "El RUC no se puede cambiar y por eso no está en el cuerpo. Cambiarlo\
        \ no es corregir un dato: es decir que los comprobantes ya emitidos pertenecen\
        \ a otro contribuyente."
      operationId: actualizar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEmpresa"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
  /api/v1/registro:
    post:
      tags:
      - Registro
      summary: Da de alta la cuenta del usuario autenticado
      description: "Crea cuenta, usuario administrador, empresa y el establecimiento\
        \ de casa matriz (0000) en una sola transacción. La identidad sale del token,\
        \ nunca del cuerpo: aceptarla como parámetro permitiría darse de alta suplantando\
        \ a otra persona."
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionRegistro"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
  /api/v1/configuracion/establecimientos:
    get:
      tags:
      - Establecimientos
      summary: "Lista los establecimientos, activos e inactivos"
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaEstablecimiento"
    post:
      tags:
      - Establecimientos
      summary: Registra un establecimiento
      description: El código son los cuatro dígitos que asigna SUNAT y aparecen en
        la ficha RUC; no se genera aquí. La casa matriz es 0000.
      operationId: registrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionNuevo"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEstablecimiento"
  /salud:
    get:
      tags:
      - salud-controller
      summary: Sonda de vida
      description: Responde si el proceso esta en pie. No comprueba dependencias.
      operationId: consultar_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Salud"
      security: []
  /api/v1/contexto:
    get:
      tags:
      - Contexto
      summary: Contexto del usuario autenticado
      description: |-
        Devuelve la identidad, las empresas a las que tiene acceso y los permisos del rol en la empresa activa.

        La empresa activa se indica con la cabecera X-Empresa-Id. Si se omite y el usuario solo tiene una, se toma esa. Si tiene varias y no la indica, la respuesta trae la lista para que elija y el conjunto de permisos vacio.
      operationId: consultar_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaContexto"
components:
  schemas:
    PeticionEdicion:
      required:
      - direccion
      - nombre
      type: object
      properties:
        nombre:
          maxLength: 200
          minLength: 0
          type: string
        direccion:
          maxLength: 400
          minLength: 0
          type: string
        ubigeo:
          pattern: "^$|^\\d{6}$"
          type: string
    RespuestaEstablecimiento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        direccion:
          type: string
        ubigeo:
          type: string
        activa:
          type: boolean
    PeticionEmpresa:
      required:
      - domicilioFiscal
      - razonSocial
      type: object
      properties:
        razonSocial:
          maxLength: 300
          minLength: 0
          type: string
        nombreComercial:
          maxLength: 300
          minLength: 0
          type: string
        domicilioFiscal:
          maxLength: 400
          minLength: 0
          type: string
        ubigeo:
          pattern: "^$|^\\d{6}$"
          type: string
    RespuestaEmpresa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ruc:
          type: string
        razonSocial:
          type: string
        nombreComercial:
          type: string
        domicilioFiscal:
          type: string
        ubigeo:
          type: string
        modoSunat:
          type: string
        activa:
          type: boolean
    PeticionRegistro:
      required:
      - domicilioFiscal
      - nombreTitular
      - razonSocial
      - ruc
      type: object
      properties:
        ruc:
          minLength: 1
          pattern: "\\d{11}"
          type: string
        razonSocial:
          maxLength: 300
          minLength: 0
          type: string
        domicilioFiscal:
          maxLength: 400
          minLength: 0
          type: string
        ubigeo:
          pattern: "^$|^\\d{6}$"
          type: string
        nombreTitular:
          maxLength: 150
          minLength: 0
          type: string
    RespuestaRegistro:
      type: object
      properties:
        cuentaId:
          type: string
          format: uuid
    PeticionNuevo:
      required:
      - codigo
      - direccion
      - nombre
      type: object
      properties:
        codigo:
          minLength: 1
          pattern: "\\d{4}"
          type: string
        nombre:
          maxLength: 200
          minLength: 0
          type: string
        direccion:
          maxLength: 400
          minLength: 0
          type: string
        ubigeo:
          pattern: "^$|^\\d{6}$"
          type: string
    Salud:
      type: object
      properties:
        estado:
          type: string
        version:
          type: string
    CuentaResumen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        esAdministrador:
          type: boolean
    EmpresaResumen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ruc:
          type: string
        razonSocial:
          type: string
        nombreComercial:
          type: string
        modoSunat:
          type: string
        rol:
          type: string
        sucursalId:
          type: string
          format: uuid
        sucursalNombre:
          type: string
    RespuestaContexto:
      type: object
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioResumen"
        cuenta:
          $ref: "#/components/schemas/CuentaResumen"
        empresaActiva:
          $ref: "#/components/schemas/EmpresaResumen"
        empresas:
          type: array
          items:
            $ref: "#/components/schemas/EmpresaResumen"
        permisos:
          type: array
          items:
            type: string
    UsuarioResumen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
  parameters:
    EmpresaActiva:
      name: X-Empresa-Id
      in: header
      description: "Empresa sobre la que opera la peticion. Es una peticion, no una\
        \ afirmacion: el servidor comprueba que el usuario tenga esa asignacion. Se\
        \ puede omitir cuando el usuario solo tiene una empresa."
      required: false
  securitySchemes:
    jwt:
      type: http
      description: Token de acceso emitido por el grupo de usuarios de Cognito.
      scheme: bearer
      bearerFormat: JWT
