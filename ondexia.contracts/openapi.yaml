# GENERADO AUTOMATICAMENTE — no editar a mano.
#
# Lo escribe ExportarContratoIT en cada ejecucion de la suite, a partir de los
# controladores de ondexia-api. Si este archivo aparece modificado en git status,
# es porque la API cambio: revisa el diff antes de confirmar, porque de aqui se
# genera el cliente Angular.
#
# Regenerar:  cd apps/backend && ./mvnw test
#
# El -am de "-pl ondexia.api -am" no es opcional si acotas el modulo: sin el,
# Maven no construye ondexia-domain y la resolucion falla.
openapi: 3.0.1
info:
  title: Ondexia — API Core
  description: |-
    Nucleo comercial: almacen, compras, ventas y configuracion.

    Esta API no habla con SUNAT. La emision de comprobantes se publica en una cola y la atiende ondexia-facturacion (DTE §3.3).
  version: 0.1.0
servers:
- url: http://localhost
  description: Generated server url
security:
- jwt: []
tags:
- name: Empresa
  description: Datos fiscales de la empresa activa
- name: Contexto
  description: "Identidad, empresas accesibles y permisos efectivos"
- name: Registro
  description: "Alta de cuenta, empresa y primer administrador"
- name: Almacenes
  description: Ubicaciones físicas de las existencias
- name: Establecimientos
  description: Anexos de la empresa ante SUNAT
- name: Identidad visual
  description: Logos de la empresa
- name: Roles
  description: Roles de la cuenta y su matriz de permisos
- name: Usuarios
  description: "Quién entra en la empresa, con qué rol y hasta dónde"
- name: Comprobantes
  description: Tipos de comprobante que emite la empresa
- name: Series
  description: Series de comprobante y su correlativo
paths:
  /api/v1/configuracion/usuarios/{asignacionId}:
    put:
      tags:
      - Usuarios
      summary: Cambia el rol o el alcance
      description: "Surte efecto en la petición siguiente: el contexto se resuelve\
        \ en cada una."
      operationId: reasignar
      parameters:
      - name: asignacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionReasignacion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
    delete:
      tags:
      - Usuarios
      summary: Retira el acceso a esta empresa
      description: La persona sigue existiendo en la cuenta y conserva las demás empresas
        que tuviera.
      operationId: retirar
      parameters:
      - name: asignacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/configuracion/usuarios/{asignacionId}/estado:
    put:
      tags:
      - Usuarios
      summary: Activa o desactiva a la persona
      description: "Afecta a toda la cuenta, no solo a esta empresa: es la única forma\
        \ de revocar el acceso antes de que caduque su token."
      operationId: cambiarEstado
      parameters:
      - name: asignacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEstado"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
  /api/v1/configuracion/series/{id}/estado:
    put:
      tags:
      - Series
      summary: Activa o desactiva una serie
      description: "Lo único editable. Desactivar no borra ni reinicia: el último\
        \ número queda como estaba, de modo que reactivarla continúa donde se quedó\
        ."
      operationId: cambiarEstado_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEstado"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaSerie"
  /api/v1/configuracion/roles/{rolId}:
    put:
      tags:
      - Roles
      summary: Renombra un rol propio
      operationId: renombrar
      parameters:
      - name: rolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionRenombrado"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaRol"
    delete:
      tags:
      - Roles
      summary: Elimina un rol propio
      description: Falla con 409 si algún usuario lo tiene asignado.
      operationId: eliminar
      parameters:
      - name: rolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/configuracion/roles/{rolId}/permisos:
    get:
      tags:
      - Roles
      summary: Los permisos que tiene un rol
      operationId: permisosDe
      parameters:
      - name: rolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
                  format: uuid
    put:
      tags:
      - Roles
      summary: Reemplaza los permisos de un rol
      description: "El cuerpo es el estado final de la matriz, no un incremento. Surte\
        \ efecto en la petición siguiente, sin esperar a que se recicle nada."
      operationId: cambiarPermisos
      parameters:
      - name: rolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionPermisos"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
                  format: uuid
  /api/v1/configuracion/identidad/{logo}:
    put:
      tags:
      - Identidad visual
      summary: Confirma la subida
      description: |-
        Comprueba contra el almacén qué llegó de verdad —tipo y tamaño— y solo entonces guarda la referencia. Responde 400 con `subida_no_completada` si el archivo no está.

        El logo anterior no se borra: los comprobantes ya emitidos lo referencian.
      operationId: confirmar
      parameters:
      - name: logo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionConfirmacion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaLogo"
    delete:
      tags:
      - Identidad visual
      summary: Quita el logo
      description: "Aquí sí se borra el archivo: significa «no quiero logo», no «\
        cambié de logo». Reemplazar conserva el anterior; quitar lo retira."
      operationId: quitar
      parameters:
      - name: logo
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaLogo"
  /api/v1/configuracion/establecimientos/{id}:
    put:
      tags:
      - Establecimientos
      summary: Actualiza un establecimiento
      description: "El código no se puede cambiar: identifica al anexo ante SUNAT."
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEdicion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEstablecimiento"
    delete:
      tags:
      - Establecimientos
      summary: Desactiva un establecimiento
      description: "No lo borra. Un establecimiento aparece en los comprobantes ya\
        \ emitidos: borrarlo dejaría documentos apuntando a nada."
      operationId: desactivar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/configuracion/empresa:
    get:
      tags:
      - Empresa
      summary: Datos de la empresa activa
      operationId: consultar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
    put:
      tags:
      - Empresa
      summary: Actualiza los datos fiscales
      description: "El RUC no se puede cambiar y por eso no está en el cuerpo. Cambiarlo\
        \ no es corregir un dato: es decir que los comprobantes ya emitidos pertenecen\
        \ a otro contribuyente."
      operationId: actualizar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEmpresa"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEmpresa"
  /api/v1/configuracion/comprobantes/{codigo}:
    put:
      tags:
      - Comprobantes
      summary: Habilita o deshabilita un tipo
      description: "No se puede deshabilitar un tipo con series activas: la pantalla\
        \ diría una cosa y el sistema haría otra. Responde 400 con `tipo_con_series_activas`."
      operationId: cambiarEstado_2
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEstado"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaTipo"
  /api/v1/almacen/almacenes/{id}:
    put:
      tags:
      - Almacenes
      summary: Actualiza un almacén
      description: "El código no cambia: identifica al almacén en los movimientos\
        \ ya registrados."
      operationId: actualizar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionEdicion"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaAlmacen"
    delete:
      tags:
      - Almacenes
      summary: Desactiva un almacén
      description: "No lo borra: aparece en cada movimiento de stock que lo tocó."
      operationId: desactivar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/registro:
    post:
      tags:
      - Registro
      summary: Da de alta la cuenta del usuario autenticado
      description: "Crea cuenta, usuario administrador, empresa y el establecimiento\
        \ de casa matriz (0000) en una sola transacción. La identidad sale del token,\
        \ nunca del cuerpo: aceptarla como parámetro permitiría darse de alta suplantando\
        \ a otra persona."
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionRegistro"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaRegistro"
  /api/v1/configuracion/usuarios:
    get:
      tags:
      - Usuarios
      summary: "Lista los usuarios de la empresa, activos e inactivos"
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaUsuario"
    post:
      tags:
      - Usuarios
      summary: Da de alta a alguien en la empresa
      description: "No crea su cuenta de acceso: eso lo hace la propia persona al\
        \ registrarse, y se vincula sola en su primer ingreso. Hasta entonces figura\
        \ como invitada."
      operationId: invitar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionNuevo"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
  /api/v1/configuracion/series:
    get:
      tags:
      - Series
      summary: "Lista las series, activas e inactivas"
      operationId: listar_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaSerie"
    post:
      tags:
      - Series
      summary: Da de alta una serie
      description: "La primera letra la fija SUNAT según el tipo: F para factura,\
        \ B para boleta, T para guía. El `numeroInicial` es para quien migra desde\
        \ otro sistema y no puede volver a numerar desde el 1; se fija aquí y no se\
        \ vuelve a tocar."
      operationId: registrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionNueva"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaSerie"
  /api/v1/configuracion/roles/{rolOrigenId}/duplicado:
    post:
      tags:
      - Roles
      summary: Duplica un rol
      description: La copia arrastra los permisos del original y ya es editable. Es
        la única forma de partir de un rol predefinido sin modificarlo.
      operationId: duplicar
      parameters:
      - name: rolOrigenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionDuplicado"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaRol"
  /api/v1/configuracion/identidad/{logo}/subida:
    post:
      tags:
      - Identidad visual
      summary: Autoriza una subida
      description: |-
        Devuelve una URL firmada a la que hay que hacer `PUT` con el archivo como cuerpo y el mismo `Content-Type` que se declaró aquí — va dentro de la firma, así que subir otra cosa da 403.

        No cambia nada todavía: hasta confirmar, es como si no hubiera pasado.
      operationId: autorizar
      parameters:
      - name: logo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionSubida"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaAutorizacion"
  /api/v1/configuracion/establecimientos:
    get:
      tags:
      - Establecimientos
      summary: "Lista los establecimientos, activos e inactivos"
      operationId: listar_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaEstablecimiento"
    post:
      tags:
      - Establecimientos
      summary: Registra un establecimiento
      description: El código son los cuatro dígitos que asigna SUNAT y aparecen en
        la ficha RUC; no se genera aquí. La casa matriz es 0000.
      operationId: registrar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionNuevo"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaEstablecimiento"
  /api/v1/almacen/almacenes:
    get:
      tags:
      - Almacenes
      summary: "Lista los almacenes, activos e inactivos"
      operationId: listar_3
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaAlmacen"
    post:
      tags:
      - Almacenes
      summary: Registra un almacén
      description: "El código lo elige el cliente: se teclea en cada movimiento de\
        \ mercadería, así que conviene que sea corto. Se guarda en mayúsculas."
      operationId: registrar_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeticionNuevo"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaAlmacen"
  /salud:
    get:
      tags:
      - salud-controller
      summary: Sonda de vida
      description: Responde si el proceso esta en pie. No comprueba dependencias.
      operationId: consultar_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Salud"
      security: []
  /api/v1/contexto:
    get:
      tags:
      - Contexto
      summary: Contexto del usuario autenticado
      description: |-
        Devuelve la identidad, las empresas a las que tiene acceso y los permisos del rol en la empresa activa.

        La empresa activa se indica con la cabecera X-Empresa-Id. Si se omite y el usuario solo tiene una, se toma esa. Si tiene varias y no la indica, la respuesta trae la lista para que elija y el conjunto de permisos vacio.
      operationId: consultar_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaContexto"
  /api/v1/configuracion/usuarios/roles-asignables:
    get:
      tags:
      - Usuarios
      summary: Roles que se pueden asignar
      description: Los predefinidos del sistema más los que esta cuenta haya creado.
      operationId: rolesAsignables
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaRolAsignable"
  /api/v1/configuracion/series/tipos-documento:
    get:
      tags:
      - Series
      summary: Catálogo 01 de SUNAT
      description: "Los tipos de documento que se pueden numerar, con la letra que\
        \ SUNAT exige al principio de la serie. Alimenta el desplegable del alta."
      operationId: tiposDocumento
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaTipoDocumento"
  /api/v1/configuracion/roles:
    get:
      tags:
      - Roles
      summary: "Lista los roles: los predefinidos y los de la cuenta"
      operationId: listar_4
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaRol"
  /api/v1/configuracion/roles/permisos:
    get:
      tags:
      - Roles
      summary: "Catálogo de permisos, como árbol de tres niveles"
      description: |-
        Módulo → submódulo → función. Lo define el sistema: es la lista de lo que Ondexia sabe hacer.

        Viene ya como árbol y con los nombres para mostrar, de modo que la pantalla no tiene que saber que `almacen.producto` cuelga de `almacen` ni traducir códigos. Un módulo nuevo aparece solo, sin tocar el frontend.

        La autorización es conjuntiva: hacen falta los tres niveles.
      operationId: catalogo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaModulo"
  /api/v1/configuracion/identidad:
    get:
      tags:
      - Identidad visual
      summary: "Los tres logos con su URL pública, si la tienen"
      operationId: consultar_3
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaLogo"
  /api/v1/configuracion/comprobantes:
    get:
      tags:
      - Comprobantes
      summary: Los cinco tipos del catálogo 01 con su estado
      description: "Vienen todos, habilitados y deshabilitados: la pantalla es un\
        \ panel de interruptores, no una lista de los activos."
      operationId: listar_5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RespuestaTipo"
components:
  schemas:
    PeticionReasignacion:
      required:
      - rolId
      type: object
      properties:
        rolId:
          type: string
          format: uuid
        sucursalId:
          type: string
          format: uuid
    RespuestaUsuario:
      type: object
      properties:
        asignacionId:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        email:
          type: string
        nombre:
          type: string
        activo:
          type: boolean
        invitado:
          type: boolean
        rolId:
          type: string
          format: uuid
        rolNombre:
          type: string
        sucursalId:
          type: string
          format: uuid
        sucursalNombre:
          type: string
        todosLosEstablecimientos:
          type: boolean
    PeticionEstado:
      required:
      - activo
      type: object
      properties:
        activo:
          type: boolean
    RespuestaSerie:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sucursalId:
          type: string
          format: uuid
        tipoDocumento:
          type: string
        tipoDocumentoNombre:
          type: string
        serie:
          type: string
        ultimoNumero:
          type: integer
          format: int64
        siguienteNumero:
          type: string
        activa:
          type: boolean
    PeticionRenombrado:
      required:
      - nombre
      type: object
      properties:
        nombre:
          maxLength: 120
          minLength: 0
          type: string
        descripcion:
          maxLength: 300
          minLength: 0
          type: string
    RespuestaRol:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        delSistema:
          type: boolean
        cantidadPermisos:
          type: integer
          format: int32
        enUso:
          type: boolean
